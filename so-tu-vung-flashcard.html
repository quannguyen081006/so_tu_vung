g":"nghỉ việc, thôi học","pos":"động từ nhóm II","lesson":"Dekiru 初中級 3","example":"アルバイトを辞めました。","exampleVi":"Tôi đã nghỉ việc làm thêm.","note":"Khác やめる（止める）= dừng lại nói chung.","deck":"初中級 3"},{"type":"vocab","word":"案内する","reading":"あんないする","meaning":"hướng dẫn, dẫn đi","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"友達に町を案内しました。","exampleVi":"Tôi đã dẫn bạn đi tham quan phố.","note":"","deck":"初中級 3"},{"type":"vocab","word":"確認する","reading":"かくにんする","meaning":"xác nhận, kiểm tra lại","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"出発の時間を確認してください。","exampleVi":"Xin kiểm tra lại giờ khởi hành.","note":"","deck":"初中級 3"},{"type":"vocab","word":"見学する","reading":"けんがくする","meaning":"tham quan kiến tập","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"来週、工場を見学します。","exampleVi":"Tuần sau tôi đi tham quan nhà máy.","note":"","deck":"初中級 3"},{"type":"vocab","word":"合格する","reading":"ごうかくする","meaning":"đỗ, thi đậu","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"試験に合格しました。","exampleVi":"Tôi đã thi đỗ.","note":"Đi với に, không phải を.","deck":"初中級 3"},{"type":"vocab","word":"進学する","reading":"しんがくする","meaning":"học lên (cấp cao hơn)","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"大学に進学したいです。","exampleVi":"Tôi muốn học lên đại học.","note":"Đi với に.","deck":"初中級 3"},{"type":"vocab","word":"就職する","reading":"しゅうしょくする","meaning":"đi làm, xin được việc","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"日本の会社に就職したいです。","exampleVi":"Tôi muốn vào làm ở công ty Nhật.","note":"Đi với に.","deck":"初中級 3"},{"type":"vocab","word":"専攻する","reading":"せんこうする","meaning":"chuyên ngành, học chuyên về","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"大学で経済を専攻しました。","exampleVi":"Ở đại học tôi học chuyên ngành kinh tế.","note":"","deck":"初中級 3"},{"type":"vocab","word":"相談する","reading":"そうだんする","meaning":"bàn bạc, xin ý kiến","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"先生に相談してみます。","exampleVi":"Tôi sẽ thử hỏi ý kiến thầy.","note":"Người được hỏi đi với に.","deck":"初中級 3"},{"type":"vocab","word":"貯金する","reading":"ちょきんする","meaning":"tiết kiệm tiền","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"毎月三万円貯金しています。","exampleVi":"Mỗi tháng tôi tiết kiệm 30 nghìn yên.","note":"","deck":"初中級 3"},{"type":"vocab","word":"通学する","reading":"つうがくする","meaning":"đi học (đi lại đến trường)","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"自転車で通学しています。","exampleVi":"Tôi đi học bằng xe đạp.","note":"Đi làm là 通勤（つうきん）.","deck":"初中級 3"},{"type":"vocab","word":"翻訳する","reading":"ほんやくする","meaning":"dịch (văn bản)","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"この本をベトナム語に翻訳したいです。","exampleVi":"Tôi muốn dịch cuốn sách này sang tiếng Việt.","note":"Dịch nói là 通訳（つうやく）.","deck":"初中級 3"},{"type":"vocab","word":"正しい","reading":"ただしい","meaning":"đúng, chính xác","pos":"tính từ -i","lesson":"Dekiru 初中級 3","example":"正しい答えはどれですか。","exampleVi":"Đáp án đúng là cái nào ạ?","note":"","deck":"初中級 3"},{"type":"vocab","word":"一生懸命","reading":"いっしょうけんめい","meaning":"hết sức, dốc hết sức","pos":"phó từ","lesson":"Dekiru 初中級 3","example":"一生懸命練習しました。","exampleVi":"Tôi đã luyện tập hết sức.","note":"Câu cửa miệng khi nói về nỗ lực.","deck":"初中級 3"},{"type":"vocab","word":"願書","reading":"がんしょ","meaning":"đơn xin nhập học/dự thi","pos":"danh từ","lesson":"Dekiru 初中級 3","example":"願書を出しました。","exampleVi":"Tôi đã nộp đơn.","note":"","deck":"初中級 3"},{"type":"vocab","word":"建築家","reading":"けんちくか","meaning":"kiến trúc sư","pos":"danh từ","lesson":"Dekiru 初中級 3","example":"将来、建築家になりたいです。","exampleVi":"Tương lai tôi muốn thành kiến trúc sư.","note":"Hậu tố 〜家（か）chỉ nghề chuyên môn.","deck":"初中級 3"},{"type":"vocab","word":"事務室","reading":"じむしつ","meaning":"phòng hành chính, văn phòng","pos":"danh từ","lesson":"Dekiru 初中級 3","example":"事務室で書類をもらってください。","exampleVi":"Xin nhận giấy tờ ở phòng hành chính.","note":"","deck":"初中級 3"},{"type":"vocab","word":"書類","reading":"しょるい","meaning":"giấy tờ, hồ sơ","pos":"danh từ","lesson":"Dekiru 初中級 3","example":"必要な書類を準備します。","exampleVi":"Tôi sẽ chuẩn bị giấy tờ cần thiết.","note":"","deck":"初中級 3"},{"type":"vocab","word":"スーツ","reading":"スーツ","meaning":"com-lê, vest","pos":"danh từ","lesson":"Dekiru 初中級 3","example":"面接にスーツを着て行きます。","exampleVi":"Tôi mặc vest đi phỏng vấn.","note":"","deck":"初中級 3"},{"type":"vocab","word":"デザイナー","reading":"デザイナー","meaning":"nhà thiết kế","pos":"danh từ","lesson":"Dekiru 初中級 3","example":"デザイナーになるのが夢です。","exampleVi":"Ước mơ của tôi là trở thành nhà thiết kế.","note":"","deck":"初中級 3"},{"type":"vocab","word":"夢","reading":"ゆめ","meaning":"ước mơ; giấc mơ","pos":"danh từ","lesson":"Dekiru 初中級 3","example":"私の夢は日本で働くことです。","exampleVi":"Ước mơ của tôi là làm việc ở Nhật.","note":"","deck":"初中級 3"},{"type":"vocab","word":"将来の夢","reading":"しょうらいのゆめ","meaning":"ước mơ tương lai","pos":"cụm danh từ","lesson":"Dekiru 初中級 3","example":"将来の夢について話してください。","exampleVi":"Hãy nói về ước mơ tương lai của bạn.","note":"Đề tài 作文 và thuyết trình rất hay gặp.","deck":"初中級 3"},{"type":"vocab","word":"〜中","reading":"〜じゅう／〜ちゅう","meaning":"trong khoảng ~, suốt ~","pos":"hậu tố","lesson":"Dekiru 初中級 3","example":"今日中に出してください。","exampleVi":"Xin nộp trong hôm nay.","note":"じゅう = trong suốt khoảng đó; ちゅう = đang trong lúc (営業中).","deck":"初中級 3"},{"type":"vocab","word":"頑張る","reading":"がんばる","meaning":"cố gắng, nỗ lực","pos":"động từ nhóm I","lesson":"Dekiru 初中級 3","example":"試験に合格するために頑張ります。","exampleVi":"Tôi sẽ cố gắng để thi đỗ.","note":"「頑張って」= cố lên, câu động viên phổ biến nhất.","deck":"初中級 3"},{"type":"vocab","word":"経営する","reading":"けいえいする","meaning":"kinh doanh, quản lý (doanh nghiệp)","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"将来、自分の店を経営したいです。","exampleVi":"Tương lai tôi muốn tự kinh doanh cửa hàng.","note":"","deck":"初中級 3"},{"type":"vocab","word":"受験する","reading":"じゅけんする","meaning":"dự thi","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"来年、大学を受験します。","exampleVi":"Năm sau tôi thi đại học.","note":"","deck":"初中級 3"},{"type":"vocab","word":"スピーチする","reading":"スピーチする","meaning":"phát biểu, diễn thuyết","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"日本語でスピーチしました。","exampleVi":"Tôi đã phát biểu bằng tiếng Nhật.","note":"","deck":"初中級 3"},{"type":"vocab","word":"体験する","reading":"たいけんする","meaning":"trải nghiệm","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"日本の文化を体験しました。","exampleVi":"Tôi đã trải nghiệm văn hoá Nhật.","note":"","deck":"初中級 3"},{"type":"vocab","word":"デッサンする","reading":"デッサンする","meaning":"vẽ phác hoạ","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"毎日デッサンの練習をしています。","exampleVi":"Ngày nào tôi cũng luyện vẽ phác.","note":"","deck":"初中級 3"},{"type":"vocab","word":"復習する","reading":"ふくしゅうする","meaning":"ôn lại bài cũ","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"授業の後で復習します。","exampleVi":"Sau giờ học tôi ôn lại bài.","note":"Cặp với 予習.","deck":"初中級 3"},{"type":"vocab","word":"予習する","reading":"よしゅうする","meaning":"chuẩn bị bài trước","pos":"động từ nhóm III","lesson":"Dekiru 初中級 3","example":"毎晩、明日の授業を予習します。","exampleVi":"Tối nào tôi cũng chuẩn bị bài cho hôm sau.","note":"Việc quan trọng nhất để nghe kịp thầy.","deck":"初中級 3"},{"type":"vocab","word":"おまわりさん","reading":"おまわりさん","meaning":"chú cảnh sát (cách gọi thân mật)","pos":"danh từ","lesson":"N4","example":"おまわりさんに道を聞きました。","exampleVi":"Tôi đã hỏi đường chú cảnh sát.","note":"Bạn đưa từ này hai lần trong danh sách, đã gộp làm một.","deck":"N4 tổng hợp"},{"type":"vocab","word":"警官","reading":"けいかん","meaning":"cảnh sát (cách gọi trang trọng)","pos":"danh từ","lesson":"N4","example":"警官が交番にいます。","exampleVi":"Cảnh sát đang ở bốt cảnh sát.","note":"警官 dùng trong văn viết và tin tức; nói chuyện hằng ngày dùng おまわりさん.","deck":"N4 tổng hợp"},{"type":"vocab","word":"交番","reading":"こうばん","meaning":"bốt cảnh sát","pos":"danh từ","lesson":"Minna 23","example":"交番は駅の前にあります。","exampleVi":"Bốt cảnh sát ở trước nhà ga.","note":"","deck":"N4 tổng hợp"},{"type":"vocab","word":"お風呂","reading":"おふろ","meaning":"bồn tắm; việc tắm","pos":"danh từ","lesson":"Minna 17","example":"毎晩お風呂に入ります。","exampleVi":"Tối nào tôi cũng đi tắm.","note":"Đi với trợ từ に: お風呂に入る.","deck":"N4 tổng hợp"},{"type":"vocab","word":"再来年","reading":"さらいねん","meaning":"năm kia (sau năm sau)","pos":"danh từ","lesson":"N4","example":"再来年、日本へ行きます。","exampleVi":"Năm kia nữa tôi sẽ đi Nhật.","note":"Bạn chỉ ghi kana さらいねん, kanji là 再来年. Cùng mẫu: 再来週 さらいしゅう, 再来月 さらいげつ.","deck":"N4 tổng hợp"},{"type":"vocab","word":"歩く","reading":"あるく","meaning":"đi bộ","pos":"động từ nhóm I","lesson":"N4","example":"学校まで歩きます。","exampleVi":"Tôi đi bộ đến trường.","note":"","deck":"N4 tổng hợp"},{"type":"vocab","word":"要る","reading":"いる","meaning":"cần","pos":"động từ nhóm I","lesson":"N4","example":"お金が要ります。","exampleVi":"Tôi cần tiền.","note":"Bạn ghi いる không kanji. Kanji là 要る và đây là động từ nhóm 1 (要ります), khác hẳn いる = 居る (có, ở) nhóm 2. Đối tượng cần đi với が, không phải を.","deck":"N4 tổng hợp"},{"type":"vocab","word":"言う","reading":"いう","meaning":"nói","pos":"động từ nhóm I","lesson":"Minna 21","example":"「ありがとう」と言いました。","exampleVi":"Tôi đã nói \"cảm ơn\".","note":"Viết là いう nhưng phát âm thực tế là ゆう.","deck":"N4 tổng hợp"},{"type":"vocab","word":"置く","reading":"おく","meaning":"đặt, để","pos":"động từ nhóm I","lesson":"N4","example":"本を机の上に置きます。","exampleVi":"Tôi đặt sách lên bàn.","note":"Nơi đặt đi với に: 机に置く.","deck":"N4 tổng hợp"},{"type":"vocab","word":"押す","reading":"おす","meaning":"đẩy, nhấn","pos":"động từ nhóm I","lesson":"N4","example":"このボタンを押してください。","exampleVi":"Hãy nhấn nút này.","note":"Cặp đối lập: 押す (đẩy) ↔ 引く (kéo) — hai chữ trên cửa ra vào ở Nhật.","deck":"N4 tổng hợp"},{"type":"vocab","word":"起きる","reading":"おきる","meaning":"thức dậy","pos":"động từ nhóm II","lesson":"Minna 4","example":"毎朝六時に起きます。","exampleVi":"Sáng nào tôi cũng dậy lúc 6 giờ.","note":"Cặp tự động/tha động: 起きる (tự dậy) ↔ 起こす (đánh thức ai).","deck":"N4 tổng hợp"},{"type":"vocab","word":"降りる","reading":"おりる","meaning":"xuống (xe, tàu, dốc)","pos":"động từ nhóm II","lesson":"Minna 16","example":"次の駅で電車を降ります。","exampleVi":"Tôi xuống tàu ở ga tiếp theo.","note":"Nghĩa hay dùng nhất là xuống xe/tàu chứ không phải xuống núi. Chỗ rời khỏi đi với を: 電車を降りる. Cặp đối lập: 乗る (lên) ↔ 降りる (xuống).","deck":"N4 tổng hợp"},{"type":"vocab","word":"覚える","reading":"おぼえる","meaning":"ghi nhớ, học thuộc","pos":"động từ nhóm II","lesson":"N4","example":"日本語の単語を覚えます。","exampleVi":"Tôi học thuộc từ vựng tiếng Nhật.","note":"Trạng thái đang nhớ phải nói 覚えています, không nói 覚えます. Nghĩa \"cảm thấy\" như 痛みを覚える là cách dùng văn viết, chưa cần ở N4.","deck":"N4 tổng hợp"},{"type":"vocab","word":"売る","reading":"うる","meaning":"bán","pos":"động từ nhóm I","lesson":"N4","example":"あの店で切手を売っています。","exampleVi":"Cửa hàng kia có bán tem.","note":"Cặp đối lập: 売る (bán) ↔ 買う (mua).","deck":"N4 tổng hợp"},{"type":"vocab","word":"生まれる","reading":"うまれる","meaning":"được sinh ra","pos":"động từ nhóm II","lesson":"N4","example":"わたしはベトナムで生まれました。","exampleVi":"Tôi sinh ra ở Việt Nam.","note":"Nơi sinh đi với で. Gần như luôn dùng ở thể quá khứ 生まれました.","deck":"N4 tổng hợp"},{"type":"vocab","word":"返す","reading":"かえす","meaning":"trả lại","pos":"động từ nhóm I","lesson":"N4","example":"図書館に本を返します。","exampleVi":"Tôi trả sách cho thư viện.","note":"Đừng nhầm với 帰る（かえる, về nhà) — khác kanji, khác nghĩa.","deck":"N4 tổng hợp"},{"type":"vocab","word":"かかる","reading":"かかる","meaning":"mất (thời gian, tiền)","pos":"động từ nhóm I","lesson":"Minna 11","example":"駅まで三十分かかります。","exampleVi":"Đến ga mất 30 phút.","note":"Thời gian và tiền đứng trần trước かかります, không thêm trợ từ を.","deck":"N4 tổng hợp"},{"type":"vocab","word":"かぶる","reading":"かぶる","meaning":"đội (lên đầu)","pos":"động từ nhóm I","lesson":"Minna 22","example":"帽子をかぶります。","exampleVi":"Tôi đội mũ.","note":"Tiếng Nhật chia động từ mặc theo bộ phận cơ thể: かぶる đội trên đầu, 着る mặc từ vai xuống, はく mặc quần và đi giày, する đeo phụ kiện.","deck":"N4 tổng hợp"},{"type":"vocab","word":"着る","reading":"きる","meaning":"mặc (áo, từ vai xuống)","pos":"động từ nhóm II","lesson":"Minna 22","example":"シャツを着ます。","exampleVi":"Tôi mặc áo sơ mi.","note":"Đừng nhầm với 切る（きる, cắt) — chữ khác nhau và 切る là nhóm 1.","deck":"N4 tổng hợp"},{"type":"vocab","word":"消す","reading":"けす","meaning":"tắt; xóa","pos":"động từ nhóm I","lesson":"Minna 14","example":"電気を消してください。","exampleVi":"Hãy tắt đèn giúp tôi.","note":"Tha động từ, cần を: 電気を消します.","deck":"N4 tổng hợp"},{"type":"vocab","word":"消える","reading":"きえる","meaning":"tắt đi; biến mất","pos":"động từ nhóm II","lesson":"Minna 29","example":"電気が消えました。","exampleVi":"Đèn đã tắt.","note":"Tự động từ, đi với が. Cặp phải học chung: 消す (tôi tắt, を) ↔ 消える (nó tự tắt, が).","deck":"N4 tổng hợp"},{"type":"vocab","word":"答える","reading":"こたえる","meaning":"trả lời","pos":"động từ nhóm II","lesson":"N4","example":"先生の質問に答えました。","exampleVi":"Tôi đã trả lời câu hỏi của thầy.","note":"Đi với に chứ không phải を: 質問に答える.","deck":"N4 tổng hợp"},{"type":"vocab","word":"差す","reading":"さす","meaning":"che, bung (ô)","pos":"động từ nhóm I","lesson":"N4","example":"雨ですから、傘を差します。","exampleVi":"Trời mưa nên tôi bung ô.","note":"Bạn chỉ ghi romaji sasu, kanji là 差す. Nói chuyện hằng ngày người Nhật hay dùng 傘をさす viết kana.","deck":"N4 tổng hợp"},{"type":"vocab","word":"困る","reading":"こまる","meaning":"gặp khó khăn, lúng túng","pos":"động từ nhóm I","lesson":"N4","example":"お金がなくて困っています。","exampleVi":"Tôi đang khổ sở vì không có tiền.","note":"Bạn ghi nghĩa là \"lo lắng\" — chưa chính xác. 困る là rơi vào tình thế khó xử, bí; \"lo lắng\" là 心配する. Thường dùng dạng 困っています.","deck":"N4 tổng hợp"},{"type":"vocab","word":"閉める","reading":"しめる","meaning":"đóng (cửa, cửa sổ)","pos":"động từ nhóm II","lesson":"Minna 14","example":"窓を閉めてください。","exampleVi":"Hãy đóng cửa sổ giúp tôi.","note":"Tha động từ, đi với を. Cặp: 閉める (tôi đóng) ↔ 閉まる (nó tự đóng).","deck":"N4 tổng hợp"},{"type":"vocab","word":"閉まる","reading":"しまる","meaning":"đóng lại (tự nó)","pos":"động từ nhóm I","lesson":"Minna 29","example":"ドアが閉まります。","exampleVi":"Cửa đóng lại.","note":"Tự động từ, đi với が. Câu bạn nghe mỗi ngày trên tàu Nhật: ドアが閉まります、ご注意ください.","deck":"N4 tổng hợp"},{"type":"vocab","word":"締める","reading":"しめる","meaning":"thắt, siết chặt","pos":"động từ nhóm II","lesson":"N4","example":"シートベルトを締めてください。","exampleVi":"Hãy thắt dây an toàn.","note":"Cùng đọc しめる với 閉める và 占める nhưng khác kanji: 締 dùng cho dây, thắt lưng, cà vạt.","deck":"N4 tổng hợp"},{"type":"vocab","word":"占める","reading":"しめる","meaning":"chiếm (tỷ lệ, vị trí)","pos":"động từ nhóm II","lesson":"N3","example":"大きな割合を占めています。","exampleVi":"Chiếm một tỷ lệ lớn.","note":"Trình độ N3, chủ yếu gặp trong văn viết và báo cáo. Bộ ba しめる: 閉める đóng, 締める thắt, 占める chiếm.","deck":"N4 tổng hợp"},{"type":"vocab","word":"知る","reading":"しる","meaning":"biết, biết đến","pos":"động từ nhóm I","lesson":"Minna 15","example":"あの人の名前を知っていますか。","exampleVi":"Bạn có biết tên người kia không?","note":"Khẳng định phải nói 知っています, nhưng phủ định lại là 知りません chứ không phải 知っていません.","deck":"N4 tổng hợp"},{"type":"vocab","word":"薄い","reading":"うすい","meaning":"mỏng; nhạt (màu, vị)","pos":"tính từ -i","lesson":"N4","example":"この本は薄いです。","exampleVi":"Quyển sách này mỏng.","note":"Cặp đối lập: 薄い ↔ 厚い (dày) khi nói về vật; 薄い ↔ 濃い (đậm) khi nói về màu và vị.","deck":"N4 tổng hợp"},{"type":"vocab","word":"汚い","reading":"きたない","meaning":"bẩn","pos":"tính từ -i","lesson":"N4","example":"部屋が汚いですから、掃除します。","exampleVi":"Phòng bẩn nên tôi sẽ dọn.","note":"Cặp đối lập: 汚い ↔ きれい (sạch, đẹp).","deck":"N4 tổng hợp"},{"type":"vocab","word":"暗い","reading":"くらい","meaning":"tối; u ám","pos":"tính từ -i","lesson":"N4","example":"この部屋は暗いです。","exampleVi":"Căn phòng này tối.","note":"Dùng được cho cả tâm trạng và không khí: 気分が暗い, 暗い映画. Cặp đối lập: 暗い ↔ 明るい (sáng).","deck":"N4 tổng hợp"},{"type":"vocab","word":"丈夫","reading":"じょうぶ","meaning":"bền, chắc; khỏe mạnh","pos":"tính từ -na","lesson":"N4","example":"この時計は丈夫です。","exampleVi":"Cái đồng hồ này bền.","note":"Đừng nhầm với 大丈夫（だいじょうぶ, không sao đâu) — thêm 大 là đổi hẳn nghĩa.","deck":"N4 tổng hợp"},{"type":"vocab","word":"言葉","reading":"ことば","meaning":"từ ngữ; ngôn ngữ","pos":"danh từ","lesson":"N4","example":"この言葉の意味が分かりません。","exampleVi":"Tôi không hiểu nghĩa của từ này.","note":"Bạn ghi kana ことば, kanji là 言葉.","deck":"N4 tổng hợp"},{"type":"vocab","word":"しょうゆ","reading":"しょうゆ","meaning":"nước tương, xì dầu","pos":"danh từ","lesson":"N4","example":"しょうゆを取ってください。","exampleVi":"Lấy giúp tôi lọ nước tương.","note":"Kanji là 醤油 nhưng thực tế hay viết kana しょうゆ.","deck":"N4 tổng hợp"},{"type":"vocab","word":"ください","reading":"ください","meaning":"làm ơn cho tôi...","pos":"cụm từ","lesson":"N4","example":"水をください。","exampleVi":"Cho tôi nước với.","note":"Bạn ghi 下さい. Khi đi sau danh từ hoặc thể て thì người Nhật viết kana ください; chỉ viết kanji 下さい khi nó là động từ đứng riêng.","deck":"N4 tổng hợp"},{"type":"vocab","word":"結構です","reading":"けっこうです","meaning":"thôi khỏi, không cần; được rồi","pos":"cụm từ","lesson":"N4","example":"「コーヒーはいかがですか。」「結構です。」","exampleVi":"\"Anh dùng cà phê nhé?\" \"Thôi, cảm ơn.\"","note":"Hai nghĩa ngược nhau, phải nghe ngữ điệu: có thể là từ chối lịch sự, cũng có thể là \"ổn rồi, được đấy\". Khi từ chối nên thêm いいえ、結構です cho rõ.","deck":"N4 tổng hợp"},{"type":"vocab","word":"こんな","reading":"こんな","meaning":"như thế này","pos":"liên thể từ","lesson":"N4","example":"こんな車が欲しいです。","exampleVi":"Tôi muốn một chiếc xe như thế này.","note":"Luôn đứng ngay trước danh từ, không thêm な. Bộ こんな・そんな・あんな・どんな học chung một lượt.","deck":"N4 tổng hợp"},{"type":"vocab","word":"しかし","reading":"しかし","meaning":"tuy nhiên, nhưng mà","pos":"liên từ","lesson":"N4","example":"日本語は難しいです。しかし、楽しいです。","exampleVi":"Tiếng Nhật khó. Tuy nhiên, học rất vui.","note":"Đứng đầu câu sau. Văn viết dùng しかし, nói chuyện thường dùng でも.","deck":"N4 tổng hợp"}];
const KEY = 'jp-flash-v1';
const IV  = [0, 1, 3, 7, 21, 60];     // ngày, theo hộp 0..5
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayN = () => Math.floor(Date.now()/864e5);

RAW.forEach((x,i) => x.id = x.word + '|' + (x.reading||'') );

/* ── tiến độ ── */
let P = {};
try { P = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ P = {}; }
let memOnly = false;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(P)); }
  catch(e){ memOnly = true; }
}
const st = id => P[id] || (P[id] = {box:0, due:0, star:false, seen:0});
const isNew  = s => s.seen === 0;
const isDue  = s => s.seen > 0 && s.due <= todayN();
const isDone = s => s.box >= 4;

/* ── bộ thẻ ── */
const DECKS = [...new Set(RAW.map(x=>x.deck))];
let cfg = { dir:'jv', nnew:20, star:false };
let ses = null;

function deckStats(d){
  const a = d==='*' ? RAW : RAW.filter(x=>x.deck===d);
  let n=0,l=0,u=0,done=0;
  a.forEach(x=>{ const s=st(x.id);
    if(isNew(s)) n++; else { if(isDue(s)) u++; if(isDone(s)) done++; else l++; } });
  return {total:a.length, nw:n, lrn:l, due:u, done};
}
function renderDecks(){
  const g = deckStats('*');
  const gpct = Math.round(g.done/g.total*100);
  $('decks').innerHTML = `<button class="deck all" data-d="*">
      <div class="nm">Ôn tất cả · mọi bộ trộn chung</div>
      <div class="bar"><i style="width:${gpct}%"></i></div>
      <div class="rowc">
        <span class="pill"><i class="dot d-new"></i>${g.nw} mới</span>
        <span class="pill"><i class="dot d-due"></i>${g.due} ôn</span>
        <span class="pill">${g.done}/${g.total} thuộc</span>
      </div></button>` + DECKS.map(d=>{
    const s = deckStats(d);
    const pct = Math.round(s.done/s.total*100);
    return `<button class="deck" data-d="${esc(d)}">
      <div class="nm">${esc(d)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="rowc">
        <span class="pill"><i class="dot d-new"></i>${s.nw} mới</span>
        <span class="pill"><i class="dot d-due"></i>${s.due} ôn</span>
        <span class="pill">${s.done}/${s.total} thuộc</span>
      </div></button>`;
  }).join('');
  [...document.querySelectorAll('.deck')].forEach(b=>b.onclick=()=>start(b.dataset.d));
  const T = RAW.length, D = RAW.filter(x=>isDone(st(x.id))).length,
        U = RAW.filter(x=>{const s=st(x.id);return isDue(s)}).length,
        S = RAW.filter(x=>st(x.id).star).length;
  $('gstat').textContent = `${T} thẻ · ${D} đã thuộc · ${U} đến hạn ôn · ${S} đánh dấu ★`
      + (memOnly ? ' · CẢNH BÁO: trình duyệt không cho lưu, tiến độ mất khi đóng tab' : '');
}

/* ── phiên học ── */
function start(deck){
  let pool = deck==='*' ? RAW.slice() : RAW.filter(x=>x.deck===deck);
  if(cfg.star) pool = pool.filter(x=>st(x.id).star);
  const due = pool.filter(x=>isDue(st(x.id)));
  const nw  = pool.filter(x=>isNew(st(x.id))).slice(0, cfg.nnew);
  const q = shuffle([...due, ...nw]);
  if(!q.length){ alert('Bộ này chưa có thẻ nào tới hạn. Chọn bộ khác hoặc tăng số từ mới.'); return; }
  ses = { deck, q, done:0, total:q.length, shown:false };
  show('study'); paint();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function paint(){
  if(!ses.q.length){ finish(); return; }
  const it = ses.q[0], s = st(it.id), rev = cfg.dir==='vj';
  $('card').className = 'card' + (rev?' rev':'');
  $('mDeck').textContent  = it.deck;
  $('mCount').textContent = `${ses.done} / ${ses.total}`;
  $('mQueue').textContent = `còn ${ses.q.length} thẻ trong hàng`;
  const ft = rev ? it.meaning : it.word;
  $('front').className = 'front' + (rev?' vi':'');
  $('front').style.fontSize = rev
      ? (ft.length > 28 ? '20px' : ft.length > 16 ? '23px' : '')
      : (ft.length > 12 ? '30px' : ft.length > 7 ? '36px' : '');
  $('front').textContent = ft;
  $('hint').textContent  = '';
  $('starBtn').className = 'star' + (s.star?' on':'');
  $('starBtn').textContent = s.star ? '★ Đã đánh dấu' : '★ Đánh dấu khó';
  $('lb2').textContent = IV[Math.min(s.box+1,5)] + ' ngày';
  $('lb3').textContent = IV[Math.min(s.box+2,5)] + ' ngày';
  ses.shown = false;
  $('back').classList.add('hide'); $('grade').classList.add('hide');
  $('tap').classList.remove('hide');
}
function flip(){
  if(ses.shown) return;
  ses.shown = true;
  const it = ses.q[0], rev = cfg.dir==='vj';
  $('back').innerHTML =
    (rev ? `<div class="mean" style="font-family:var(--jpg)">${esc(it.word)}</div>` : '') +
    (it.reading && it.reading!==it.word ? `<div class="hintr">${esc(it.reading)}</div>` : '') +
    (rev ? '' : `<div class="mean">${esc(it.meaning)}</div>`) +
    `<div class="pos">${esc(it.pos)} · ${esc(it.lesson)}</div>` +
    (it.example ? `<div class="ex">${esc(it.example)}</div>` : '') +
    (it.exampleVi ? `<div class="exvi">${esc(it.exampleVi)}</div>` : '') +
    (it.note ? `<div class="note">${esc(it.note)}</div>` : '');
  $('back').classList.remove('hide');
  $('grade').classList.remove('hide');
  $('tap').classList.add('hide');
}
function grade(qv){
  if(!ses.shown) return;
  const it = ses.q.shift(), s = st(it.id);
  s.seen++;
  if(qv===1){ s.box = 0; s.due = todayN(); ses.q.splice(Math.min(3, ses.q.length), 0, it); }
  else { s.box = Math.min(s.box + (qv===3?2:1), 5); s.due = todayN() + IV[s.box]; ses.done++; }
  save(); paint();
}
function finish(){
  $('vStudy').innerHTML = `<div class="done"><div class="big">お疲れさま</div>
    <p>Xong lượt ôn <b>${esc(ses.deck==='*'?'tất cả các bộ':ses.deck)}</b> — ${ses.total} thẻ.</p>
    <button class="btn" id="fin">Về bộ thẻ</button></div>`;
  $('fin').onclick = () => location.reload();
}

/* ── danh sách ── */
function renderList(){
  const q = $('q').value.trim().toLowerCase(), fd = $('fd').value, fs = $('fs').value;
  const rows = RAW.filter(x=>{
    if(fd && x.deck!==fd) return false;
    const s = st(x.id);
    if(fs==='new' && !isNew(s)) return false;
    if(fs==='lrn' && (isNew(s)||isDone(s))) return false;
    if(fs==='done' && !isDone(s)) return false;
    if(fs==='star' && !s.star) return false;
    if(q && !(x.word+x.reading+x.meaning+x.example+x.exampleVi+x.note).toLowerCase().includes(q)) return false;
    return true;
  });
  $('tbl').innerHTML = `<p style="font-size:12.5px;color:var(--ink3)">${rows.length} thẻ</p>
   <table><thead><tr><th>Từ</th><th>Cách đọc</th><th>Nghĩa</th><th class="ex">Ví dụ</th><th>Bộ</th></tr></thead>
   <tbody>${rows.map(x=>{const s=st(x.id);
     return `<tr><td class="w">${s.star?'★ ':''}${esc(x.word)}</td><td class="r">${esc(x.reading)}</td>
     <td>${esc(x.meaning)}<div class="pos">${esc(x.pos)}</div></td>
     <td class="ex"><div class="ex">${esc(x.example)}</div><div class="exvi">${esc(x.exampleVi)}</div></td>
     <td class="tagd">${esc(x.deck)}<div class="pos">${isNew(s)?'chưa học':(isDone(s)?'đã thuộc':'đang học')}</div></td></tr>`;
   }).join('')}</tbody></table>`;
}

/* ── điều hướng ── */
function show(v){
  $('vHome').classList.toggle('hide', v!=='home');
  $('vStudy').classList.toggle('hide', v!=='study');
  $('vList').classList.toggle('hide', v!=='list');
  [...document.querySelectorAll('.tab')].forEach(t=>t.classList.toggle('on', t.dataset.v===v));
  if(v==='home') renderDecks();
  if(v==='list') renderList();
}
[...document.querySelectorAll('.tab')].forEach(t=>t.onclick=()=>show(t.dataset.v));
$('card').onclick = flip;
[...document.querySelectorAll('.g')].forEach(b=>b.onclick=()=>grade(+b.dataset.q));
$('backBtn').onclick = ()=>show('home');
$('starBtn').onclick = ()=>{ const s=st(ses.q[0].id); s.star=!s.star; save(); paint(); if(ses.shown){ses.shown=false;flip();} };
$('dir').onchange   = e => cfg.dir = e.target.value;
$('nnew').onchange  = e => cfg.nnew = +e.target.value;
$('starOnly').onclick = e => { cfg.star=!cfg.star; e.target.classList.toggle('on');
  e.target.style.background = cfg.star?'var(--seal)':''; e.target.style.color = cfg.star?'#fff':'';
  e.target.textContent = cfg.star?'Chỉ thẻ ★ (đang bật)':'Chỉ thẻ ★'; renderDecks(); };
['q','fd','fs'].forEach(id=>$(id).addEventListener('input', renderList));
$('fd').innerHTML = '<option value="">Tất cả bộ</option>' + DECKS.map(d=>`<option>${esc(d)}</option>`).join('');
$('resetBtn').onclick = ()=>{ if(confirm('Xoá toàn bộ tiến độ học? Từ vựng vẫn giữ nguyên.')){ P={}; save(); renderDecks(); } };
$('expBtn').onclick = ()=>{ const t=JSON.stringify(P); navigator.clipboard?.writeText(t)
  .then(()=>alert('Đã chép tiến độ vào clipboard.')).catch(()=>prompt('Chép đoạn này:', t)); };

document.addEventListener('keydown', e=>{
  if($('vStudy').classList.contains('hide')) return;
  if(e.key===' '){ e.preventDefault(); ses.shown ? grade(3) : flip(); }
  else if(e.key==='1') grade(1);
  else if(e.key==='2') grade(2);
  else if(e.key==='3') grade(3);
  else if(e.key==='Escape') show('home');
});

show('home');
</script>
