<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>単語帳 — Flashcard</title>
<style>
:root{
  --paper:#ECEEF1; --card:#FBFCFD; --ink:#141B26; --ink2:#4E5A6B; --ink3:#8A94A2;
  --rule:#D2D8E0; --indigo:#2A4A7B; --seal:#A83A2C; --wist:#63558A; --green:#1E6B3A;
  --sans:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --jp:'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif;
  --jpg:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','MS Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
     line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:19px;margin:0}
.jpt{font-family:var(--jp);font-size:13px;color:var(--ink3);letter-spacing:.22em}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
       border-bottom:2px solid var(--indigo);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--rule);background:var(--card);color:var(--ink2);border-radius:999px;
     padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--indigo);background:var(--indigo);color:#fff;border-radius:10px;padding:10px 16px}
.btn.ghost{background:var(--card);color:var(--indigo)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.hide{display:none!important}

/* ── màn chọn bộ ── */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0}
.deck{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:13px 14px;
      text-align:left;display:flex;flex-direction:column;gap:7px}
.deck:hover{border-color:var(--indigo)}
.deck.all{grid-column:1/-1;background:#F5F7FC;border-color:#C9D4E5}
.deck .nm{font-family:var(--jpg);font-weight:600;font-size:15px}
.deck .rowc{display:flex;gap:10px;font-size:12px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.d-new{background:var(--indigo)} .d-lrn{background:var(--seal)} .d-due{background:var(--green)}
.bar{height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}

/* ── thẻ ── */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.meta{font-size:12px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{width:100%;background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--indigo);
      border-radius:14px;padding:30px 22px;min-height:230px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:12px;text-align:center;
      box-shadow:0 1px 0 rgba(20,27,38,.04),0 8px 24px -18px rgba(20,27,38,.35);cursor:pointer}
.card.rev{border-left-color:var(--wist)}
.front{font-family:var(--jp);font-size:46px;font-weight:600;line-height:1.25;word-break:break-word}
.front.vi{font-family:var(--sans);font-size:26px;font-weight:600}
.hintr{font-family:var(--jpg);font-size:17px;color:var(--ink2)}
.tap{font-size:12px;color:var(--ink3);margin-top:4px}
.back{width:100%;border-top:1px dashed var(--rule);padding-top:14px;margin-top:4px;
      display:flex;flex-direction:column;gap:9px}
.mean{font-size:21px;font-weight:600}
.pos{font-size:12px;color:var(--ink3)}
.ex{font-family:var(--jpg);font-size:16px;color:var(--ink)}
.exvi{font-size:13.5px;color:var(--ink2);font-style:italic}
.note{font-size:13px;color:var(--ink2);background:#F4F6FA;border-radius:8px;padding:9px 11px;text-align:left}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.g{border-radius:10px;padding:12px 6px;border:1px solid;background:var(--card);font-size:13px;font-weight:600;
   display:flex;flex-direction:column;gap:2px;align-items:center}
.g small{font-weight:400;font-size:11px;opacity:.7}
.g1{border-color:var(--seal);color:var(--seal)}
.g2{border-color:#B07D1A;color:#8A5F10}
.g3{border-color:var(--green);color:var(--green)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.star{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink2)}
.star.on{border-color:var(--seal);color:var(--seal)}
.done{text-align:center;padding:40px 10px}
.done .big{font-family:var(--jp);font-size:34px;margin-bottom:8px}

/* ── danh sách ── */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--card);color:var(--ink)}
input{flex:1;min-width:150px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
td.w{font-family:var(--jpg);font-weight:600;white-space:nowrap}
td.r{font-family:var(--jpg);color:var(--ink2);white-space:nowrap}
.tagd{font-size:11px;color:var(--ink3);white-space:nowrap}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink3);
      display:flex;gap:12px;flex-wrap:wrap;align-items:center}
@media(max-width:560px){
  .front{font-size:38px}.card{padding:24px 16px;min-height:200px}
  .wrap{padding:14px 12px 30px}
  td.ex,th.ex{display:none}
}
</style>

<div class="wrap">
<header>
  <div>
    <div class="jpt">単語帳</div>
    <h1>Flashcard — Dekiru &amp; N4</h1>
  </div>
  <div class="tabs">
    <button class="tab on" data-v="home">Bộ thẻ</button>
    <button class="tab" data-v="list">Danh sách</button>
  </div>
</header>

<!-- HOME -->
<section id="vHome">
  <div class="tools">
    <select id="dir">
      <option value="jv">日本語 → Tiếng Việt</option>
      <option value="vj">Tiếng Việt → 日本語</option>
    </select>
    <select id="nnew">
      <option value="10">10 từ mới mỗi lượt</option>
      <option value="20" selected>20 từ mới mỗi lượt</option>
      <option value="40">40 từ mới mỗi lượt</option>
      <option value="999">Không giới hạn</option>
    </select>
    <button class="btn ghost sm" id="starOnly">Chỉ thẻ ★</button>
  </div>
  <div class="decks" id="decks"></div>
  <div class="foot">
    <span id="gstat"></span>
    <button class="star" id="resetBtn">Xoá tiến độ</button>
    <button class="star" id="expBtn">Xuất tiến độ</button>
  </div>
</section>

<!-- STUDY -->
<section id="vStudy" class="hide">
  <div class="stage">
    <div class="meta">
      <span id="mDeck"></span><span id="mCount"></span><span id="mQueue"></span>
    </div>
    <div class="card" id="card">
      <div class="front" id="front"></div>
      <div class="hintr" id="hint"></div>
      <div class="tap" id="tap">Bấm vào thẻ hoặc phím cách để lật</div>
      <div class="back hide" id="back"></div>
    </div>
    <div class="grade hide" id="grade">
      <button class="g g1" data-q="1">Chưa thuộc<small>gặp lại ngay</small></button>
      <button class="g g2" data-q="2">Tạm được<small id="lb2">1 ngày</small></button>
      <button class="g g3" data-q="3">Thuộc rồi<small id="lb3">3 ngày</small></button>
    </div>
    <div class="ctrl">
      <button class="star" id="starBtn">★ Đánh dấu khó</button>
      <button class="star" id="backBtn">← Về bộ thẻ</button>
    </div>
  </div>
</section>

<!-- LIST -->
<section id="vList" class="hide">
  <div class="tools">
    <input id="q" placeholder="Tìm theo chữ, cách đọc, nghĩa, ví dụ…">
    <select id="fd"><option value="">Tất cả bộ</option></select>
    <select id="fs">
      <option value="">Mọi trạng thái</option>
      <option value="new">Chưa học</option>
      <option value="lrn">Đang học</option>
      <option value="done">Đã thuộc</option>
      <option value="star">Đánh dấu ★</option>
    </select>
  </div>
  <div id="tbl"></div>
</section>
</div>

<script>
const RAW = [{"type":"vocab","word":"けが","reading":"けが","meaning":"vết thương","pos":"danh từ","lesson":"Dekiru 12","example":"サッカーをして、けがをしました。","exampleVi":"Tôi chơi bóng đá rồi bị thương.","note":"Luôn đi với します: けがをします. Bị thương ở đâu thì dùng を: 足をけがしました.","deck":"初級 12"},{"type":"vocab","word":"食欲","reading":"しょくよく","meaning":"sự thèm ăn, ngon miệng","pos":"danh từ","lesson":"Dekiru 12","example":"熱があって、食欲がありません。","exampleVi":"Tôi bị sốt nên không thấy thèm ăn.","note":"THỰC DỤC — 食 (ăn) + 欲 (ham muốn). Ghép nghĩa ra luôn: ham muốn ăn.","deck":"初級 12"},{"type":"vocab","word":"調子","reading":"ちょうし","meaning":"tình trạng (sức khoẻ, máy móc)","pos":"danh từ","lesson":"Dekiru 12","example":"パソコンの調子が悪いです。","exampleVi":"Máy tính của tôi trục trặc.","note":"ĐIỀU TỬ. Dùng cho cả người lẫn máy: 体の調子, パソコンの調子. 調子が悪い = không khoẻ / máy trục trặc","deck":"初級 12"},{"type":"vocab","word":"熱","reading":"ねつ","meaning":"nhiệt độ; sốt","pos":"danh từ","lesson":"Dekiru 12","example":"三十八度の熱があります。","exampleVi":"Tôi sốt 38 độ.","note":"NHIỆT. Nói 'bị sốt' là 熱があります, không nói 熱です.","deck":"初級 12"},{"type":"vocab","word":"病気","reading":"びょうき","meaning":"bệnh, ốm","pos":"danh từ","lesson":"Dekiru 12","example":"父は病気で入院しています。","exampleVi":"Bố tôi bị bệnh nên đang nằm viện.","note":"BỆNH KHÍ — 病 (bệnh) + 気 (khí). Người Nhật coi bệnh là 'khí bị bệnh'.","deck":"初級 12"},{"type":"vocab","word":"のど","reading":"のど","meaning":"họng","pos":"danh từ","lesson":"Dekiru 12","example":"のどが痛いですから、病院へ行きます。","exampleVi":"Vì đau họng nên tôi đi bệnh viện.","note":"Đau chỗ nào thì chỗ đó + が痛い. のどが痛い = đau họng","deck":"初級 12"},{"type":"vocab","word":"歯","reading":"は","meaning":"răng","pos":"danh từ","lesson":"Dekiru 12","example":"寝る前に歯を磨きます。","exampleVi":"Tôi đánh răng trước khi ngủ.","note":"XỈ. Nhớ chung với 歯医者 (nha sĩ) và 歯ブラシ (bàn chải).","deck":"初級 12"},{"type":"vocab","word":"飲み会","reading":"のみかい","meaning":"bữa nhậu, tiệc rượu","pos":"danh từ","lesson":"Dekiru 12","example":"金曜日に会社の飲み会があります。","exampleVi":"Thứ sáu có tiệc rượu của công ty.","note":"飲む + 会 → 'hội uống'. Văn hoá công ty Nhật, bạn sẽ gặp nhiều khi đi làm.","deck":"初級 12"},{"type":"vocab","word":"～度","reading":"～ど","meaning":"~ độ","pos":"hậu tố","lesson":"Dekiru 12","example":"今日は三十度もあります。","exampleVi":"Hôm nay những 30 độ.","note":"ĐỘ. Dùng cho cả nhiệt độ lẫn số lần: 一度 = một lần. 38度の熱 = sốt 38 độ","deck":"初級 12"},{"type":"vocab","word":"治ります［治る］","reading":"なおります","meaning":"khỏi (bệnh)","pos":"động từ nhóm I","lesson":"Dekiru 12","example":"薬を飲んだら、すぐ治りました。","exampleVi":"Uống thuốc xong là tôi khỏi ngay.","note":"TRỊ. Tự động từ đi với が: 病気が治ります. Chữa cho ai đó là 治します／治療します. Tự động từ, đi với が","deck":"初級 12"},{"type":"vocab","word":"悪い","reading":"わるい","meaning":"xấu, tồi","pos":"tính từ -i","lesson":"Dekiru 12","example":"今日は天気が悪いですから、出かけません。","exampleVi":"Hôm nay thời tiết xấu nên tôi không ra ngoài.","note":"ÁC. Trái nghĩa: いい／良い.","deck":"初級 12"},{"type":"vocab","word":"気持ちが悪い","reading":"きもちがわるい","meaning":"khó chịu, buồn nôn","pos":"cụm từ","lesson":"Dekiru 12","example":"バスに乗って、気持ちが悪くなりました。","exampleVi":"Lên xe buýt xong tôi thấy buồn nôn.","note":"気持ち (tâm trạng) + 悪い. Nghĩa thật là buồn nôn / thấy gớm, không phải 'tâm trạng xấu'.","deck":"初級 12"},{"type":"vocab","word":"大丈夫（な）","reading":"だいじょうぶ（な）","meaning":"ổn, không sao","pos":"tính từ -na","lesson":"Dekiru 12","example":"熱はもうありません。大丈夫です。","exampleVi":"Tôi hết sốt rồi, không sao đâu.","note":"ĐẠI TRƯỢNG PHU. Đừng nhầm với 丈夫（じょうぶ）= bền chắc — thêm 大 là đổi hẳn nghĩa.","deck":"初級 12"},{"type":"vocab","word":"早く","reading":"はやく","meaning":"sớm","pos":"phó từ","lesson":"Dekiru 12","example":"早く元気になってください。","exampleVi":"Mong bạn mau khoẻ lại.","note":"TẢO. Phân biệt 早い (sớm, về thời điểm) với 速い (nhanh, về tốc độ). Dạng phó từ của 早い","deck":"初級 12"},{"type":"vocab","word":"おかげさまで","reading":"おかげさまで","meaning":"nhờ trời, cũng may","pos":"cụm từ","lesson":"Dekiru 12","example":"「お体はどうですか。」「おかげさまで、よくなりました。」","exampleVi":"\"Sức khoẻ anh sao rồi?\" \"Nhờ trời, tôi đỡ nhiều rồi.\"","note":"Câu đáp cố định khi được hỏi thăm. Nói được câu này là ghi điểm lịch sự. Câu đáp lịch sự khi được hỏi thăm","deck":"初級 12"},{"type":"vocab","word":"お大事に","reading":"おだいじに","meaning":"chúc chóng khỏe","pos":"cụm từ","lesson":"Dekiru 12","example":"「風邪をひきました。」「そうですか。お大事に。」","exampleVi":"\"Tôi bị cảm.\" \"Vậy à, chúc anh chóng khỏe.\"","note":"ĐẠI SỰ. Câu chia tay chuẩn khi rời phòng khám hoặc nói với người ốm. Nói với người ốm khi chia tay","deck":"初級 12"},{"type":"vocab","word":"それはいけませんね","reading":"それはいけませんね","meaning":"thế thì gay quá nhỉ","pos":"cụm từ","lesson":"Dekiru 12","example":"「熱が四十度あります。」「それはいけませんね。」","exampleVi":"\"Tôi sốt 40 độ.\" \"Thế thì gay quá nhỉ.\"","note":"Câu chia sẻ khi nghe tin xấu. Không có nghĩa 'không được phép'.","deck":"初級 12"},{"type":"vocab","word":"シャワー","reading":"シャワー","meaning":"vòi hoa sen","pos":"danh từ","lesson":"Dekiru 12","example":"毎朝シャワーを浴びます。","exampleVi":"Sáng nào tôi cũng tắm vòi sen.","note":"Đi với 浴びる, không dùng 入る. 入る dành cho お風呂. シャワーを浴びます = tắm vòi sen","deck":"初級 12"},{"type":"vocab","word":"睡眠","reading":"すいみん","meaning":"giấc ngủ, việc ngủ","pos":"danh từ","lesson":"Dekiru 12","example":"睡眠が足りないと、体に悪いです。","exampleVi":"Ngủ không đủ thì hại sức khoẻ.","note":"THUỴ MIÊN. Từ trang trọng; nói chuyện thường ngày dùng 寝る.","deck":"初級 12"},{"type":"vocab","word":"歯医者","reading":"はいしゃ","meaning":"nha sĩ","pos":"danh từ","lesson":"Dekiru 12","example":"歯が痛いので、歯医者に行きます。","exampleVi":"Răng đau nên tôi đi nha sĩ.","note":"XỈ Y GIẢ = răng + y + người. Mẫu 〜医者 dùng chung: 目医者 (bác sĩ mắt).","deck":"初級 12"},{"type":"vocab","word":"やけど","reading":"やけど","meaning":"bỏng, vết bỏng","pos":"danh từ","lesson":"Dekiru 12","example":"熱いお湯でやけどをしました。","exampleVi":"Tôi bị bỏng vì nước nóng.","note":"Đi với します giống けが: やけどをします.","deck":"初級 12"},{"type":"vocab","word":"こと","reading":"こと","meaning":"việc","pos":"danh từ","lesson":"Dekiru 12","example":"日本語を話すことができます。","exampleVi":"Tôi nói được tiếng Nhật.","note":"Danh từ hoá động từ. Trong mẫu 〜ことができる người Nhật thường viết kana.","deck":"初級 12"},{"type":"vocab","word":"もの","reading":"もの","meaning":"vật, đồ vật","pos":"danh từ","lesson":"Dekiru 12","example":"かたいものを食べないでください。","exampleVi":"Đừng ăn đồ cứng.","note":"VẬT. Phân biệt: もの là vật chất sờ được, こと là việc trừu tượng.","deck":"初級 12"},{"type":"vocab","word":"以上","reading":"いじょう","meaning":"trên, hơn","pos":"danh từ","lesson":"Dekiru 12","example":"三十分以上歩きました。","exampleVi":"Tôi đã đi bộ hơn 30 phút.","note":"DĨ THƯỢNG. Bao gồm cả mốc: 18歳以上 là tính cả 18 tuổi. Cặp với 以下. 30分以上 = từ 30 phút trở lên","deck":"初級 12"},{"type":"vocab","word":"出します［出す］","reading":"だします","meaning":"lấy ra, đưa ra; xuất trình, nộp","pos":"động từ nhóm I","lesson":"Dekiru 12","example":"大きい声を出してください。","exampleVi":"Hãy nói to lên.","note":"XUẤT. Tha động từ, đi với を. Cặp: 出る (tự ra) ↔ 出す (đưa ra). 声を出します = cất tiếng, nói ra","deck":"初級 12"},{"type":"vocab","word":"塗ります［塗る］","reading":"ぬります","meaning":"bôi, thoa, sơn","pos":"động từ nhóm I","lesson":"Dekiru 12","example":"一日に三回、薬を塗ってください。","exampleVi":"Mỗi ngày hãy bôi thuốc ba lần.","note":"ĐỒ. Dùng cho bôi thuốc, quét sơn, phết bơ. 薬を塗ります = bôi thuốc","deck":"初級 12"},{"type":"vocab","word":"浴びます［浴びる］","reading":"あびます","meaning":"tắm (dội nước)","pos":"động từ nhóm II","lesson":"Dekiru 12","example":"運動したあとで、シャワーを浴びます。","exampleVi":"Sau khi tập thể dục tôi đi tắm.","note":"DỤC. Chỉ dùng cho tắm vòi sen hoặc dội nước, không dùng cho ngâm bồn.","deck":"初級 12"},{"type":"vocab","word":"出かけます［出かける］","reading":"でかけます","meaning":"đi ra ngoài","pos":"động từ nhóm II","lesson":"Dekiru 12","example":"母は買い物に出かけました。","exampleVi":"Mẹ tôi đi mua sắm rồi.","note":"出 (ra) + かける. Mục đích đi thì dùng に: 買い物に出かけます.","deck":"初級 12"},{"type":"vocab","word":"運動します［運動する］","reading":"うんどうします","meaning":"tập thể dục","pos":"động từ nhóm III","lesson":"Dekiru 12","example":"健康のために、毎日運動しています。","exampleVi":"Vì sức khoẻ, ngày nào tôi cũng tập thể dục.","note":"VẬN ĐỘNG — gần y hệt tiếng Việt, coi như từ cho không.","deck":"初級 12"},{"type":"vocab","word":"固い","reading":"かたい","meaning":"cứng","pos":"tính từ -i","lesson":"Dekiru 12","example":"このパンは固くて、食べにくいです。","exampleVi":"Bánh mì này cứng, khó ăn.","note":"CỐ. Trái nghĩa: 柔らかい.","deck":"初級 12"},{"type":"vocab","word":"柔らかい","reading":"やわらかい","meaning":"mềm","pos":"tính từ -i","lesson":"Dekiru 12","example":"赤ちゃんの手は柔らかいです。","exampleVi":"Tay em bé mềm mại.","note":"NHU. Cùng chữ 柔 với 柔道 (nhu đạo).","deck":"初級 12"},{"type":"vocab","word":"体にいい","reading":"からだにいい","meaning":"tốt cho sức khoẻ","pos":"cụm từ","lesson":"Dekiru 12","example":"野菜は体にいいです。","exampleVi":"Rau tốt cho sức khoẻ.","note":"Mẫu 〜にいい／〜に悪い: 目に悪い = hại mắt.","deck":"初級 12"},{"type":"vocab","word":"自分で","reading":"じぶんで","meaning":"tự mình","pos":"phó từ","lesson":"Dekiru 12","example":"自分で作りましたから、おいしくないかもしれません。","exampleVi":"Vì tôi tự làm nên có thể không ngon.","note":"TỰ PHÂN. 自分で = tự tay làm, 自分の = của riêng mình.","deck":"初級 12"},{"type":"vocab","word":"できるだけ","reading":"できるだけ","meaning":"càng nhiều càng tốt, hết sức","pos":"phó từ","lesson":"Dekiru 12","example":"できるだけ早く帰ってください。","exampleVi":"Hãy về sớm nhất có thể.","note":"Nghĩa đen 'hết mức có thể'. Đứng trước tính từ hoặc động từ.","deck":"初級 12"},{"type":"vocab","word":"ゆっくり","reading":"ゆっくり","meaning":"thong thả, từ từ","pos":"phó từ","lesson":"Dekiru 12","example":"ゆっくり休んでください。","exampleVi":"Hãy nghỉ ngơi thong thả.","note":"Còn nghĩa 'chậm rãi': ゆっくり話してください = nói chậm lại giúp tôi. ゆっくり休んでください = hãy nghỉ ngơi thong thả","deck":"初級 12"},{"type":"vocab","word":"薬剤師","reading":"やくざいし","meaning":"dược sĩ","pos":"danh từ","lesson":"Dekiru 12","example":"薬局で薬剤師に相談しました。","exampleVi":"Tôi hỏi ý kiến dược sĩ ở hiệu thuốc.","note":"DƯỢC TỄ SƯ. Hậu tố 〜師 chỉ nghề chuyên môn: 医師, 教師, 美容師.","deck":"初級 12"},{"type":"vocab","word":"上着","reading":"うわぎ","meaning":"áo khoác","pos":"danh từ","lesson":"Dekiru 12","example":"寒いですから、上着を着てください。","exampleVi":"Trời lạnh, hãy mặc áo khoác vào.","note":"THƯỢNG TRƯỚC = áo mặc phía trên. Đi với 着る.","deck":"初級 12"},{"type":"vocab","word":"コンタクトレンズ","reading":"コンタクトレンズ","meaning":"kính áp tròng","pos":"danh từ","lesson":"Dekiru 12","example":"わたしはコンタクトレンズをしています。","exampleVi":"Tôi đang đeo kính áp tròng.","note":"Nói tắt là コンタクト. Đeo thì dùng する, không dùng かける.","deck":"初級 12"},{"type":"vocab","word":"説明書","reading":"せつめいしょ","meaning":"tờ hướng dẫn sử dụng","pos":"danh từ","lesson":"Dekiru 12","example":"説明書を読んでから、使ってください。","exampleVi":"Hãy đọc tờ hướng dẫn rồi mới dùng.","note":"THUYẾT MINH THƯ. Ba chữ Hán ghép đúng nghĩa. Ở công ty còn có 仕様書 (bản đặc tả).","deck":"初級 12"},{"type":"vocab","word":"（お）風呂","reading":"（お）ふろ","meaning":"bồn tắm; việc tắm","pos":"danh từ","lesson":"Dekiru 12","example":"毎晩お風呂に入ります。","exampleVi":"Tối nào tôi cũng đi tắm bồn.","note":"PHONG LỮ. Đi với に入る, khác シャワーを浴びる. お風呂に入ります = đi tắm","deck":"初級 12"},{"type":"vocab","word":"保険証","reading":"ほけんしょう","meaning":"thẻ bảo hiểm","pos":"danh từ","lesson":"Dekiru 12","example":"受付で保険証を出してください。","exampleVi":"Xin xuất trình thẻ bảo hiểm ở quầy lễ tân.","note":"BẢO HIỂM CHỨNG. Sang Nhật đi khám lần nào cũng phải đưa cái này. Giấy tờ bắt buộc mang khi đi khám ở Nhật","deck":"初級 12"},{"type":"vocab","word":"待合室","reading":"まちあいしつ","meaning":"phòng chờ","pos":"danh từ","lesson":"Dekiru 12","example":"待合室で名前を呼ばれるまで待ちます。","exampleVi":"Tôi đợi ở phòng chờ đến khi được gọi tên.","note":"ĐÃI HỢP THẤT = đợi + tụ + phòng.","deck":"初級 12"},{"type":"vocab","word":"薬局","reading":"やっきょく","meaning":"hiệu thuốc","pos":"danh từ","lesson":"Dekiru 12","example":"この薬は薬局で買えます。","exampleVi":"Thuốc này mua được ở hiệu thuốc.","note":"DƯỢC CỤC. Ở Nhật bệnh viện kê đơn, ra 薬局 riêng để lấy thuốc.","deck":"初級 12"},{"type":"vocab","word":"脱ぎます［脱ぐ］","reading":"ぬぎます","meaning":"cởi (áo, giày)","pos":"động từ nhóm I","lesson":"Dekiru 12","example":"玄関で靴を脱ぎます。","exampleVi":"Tôi cởi giày ở lối vào nhà.","note":"THOÁT. Trái nghĩa theo bộ phận: 着る／はく／かぶる ↔ tất cả đều cởi bằng 脱ぐ. Trái nghĩa: 着ます／はきます","deck":"初級 12"},{"type":"vocab","word":"走ります［走る］","reading":"はしります","meaning":"chạy","pos":"động từ nhóm I","lesson":"Dekiru 12","example":"駅まで走りましたが、間に合いませんでした。","exampleVi":"Tôi chạy đến ga nhưng vẫn không kịp.","note":"TẨU. Nhóm 1 dù đuôi る — đây là ngoại lệ hay bị chia sai.","deck":"初級 12"},{"type":"vocab","word":"待ちます［待つ］","reading":"まちます","meaning":"đợi, chờ","pos":"động từ nhóm I","lesson":"Dekiru 12","example":"ここで少し待ってください。","exampleVi":"Hãy đợi ở đây một lát.","note":"ĐÃI. Đợi ai/cái gì dùng を: 友だちを待ちます.","deck":"初級 12"},{"type":"vocab","word":"磨きます［磨く］","reading":"みがきます","meaning":"đánh (răng), lau bóng","pos":"động từ nhóm I","lesson":"Dekiru 12","example":"食事のあとで歯を磨きます。","exampleVi":"Sau bữa ăn tôi đánh răng.","note":"MA. Ngoài đánh răng còn nghĩa mài giũa: 技術を磨く = trau dồi kỹ năng. 歯を磨きます","deck":"初級 12"},{"type":"vocab","word":"横になります［横になる］","reading":"よこになります","meaning":"nằm xuống","pos":"động từ nhóm I","lesson":"Dekiru 12","example":"疲れたので、少し横になります。","exampleVi":"Mệt quá nên tôi nằm nghỉ một chút.","note":"HOÀNH = nằm ngang. Khác 寝る (ngủ) — 横になる chỉ là ngả lưng.","deck":"初級 12"},{"type":"vocab","word":"準備します［準備する］","reading":"じゅんびします","meaning":"chuẩn bị","pos":"động từ nhóm III","lesson":"Dekiru 12","example":"会議の準備をしました。","exampleVi":"Tôi đã chuẩn bị cho cuộc họp.","note":"CHUẨN BỊ — trùng khít tiếng Việt. Đồng nghĩa gần: 用意します. Sách đánh dấu nhóm 1 — thực tế đây là động từ する, nhóm 3","deck":"初級 12"},{"type":"vocab","word":"かゆい","reading":"かゆい","meaning":"ngứa","pos":"tính từ -i","lesson":"Dekiru 12","example":"背中がかゆいです。","exampleVi":"Tôi ngứa lưng.","note":"Cùng mẫu với 痛い: chỗ nào + が + かゆい.","deck":"初級 12"},{"type":"vocab","word":"紅葉","reading":"こうよう","meaning":"lá đỏ, lá phong mùa thu","pos":"danh từ","lesson":"Dekiru 13","example":"秋になったら、紅葉を見に行きたいです。","exampleVi":"Đến mùa thu tôi muốn đi ngắm lá đỏ.","note":"HỒNG DIỆP = lá đỏ. Đọc こうよう; riêng cây phong 紅葉 đọc もみじ.","deck":"初級 13"},{"type":"vocab","word":"サービス","reading":"サービス","meaning":"dịch vụ","pos":"danh từ","lesson":"Dekiru 13","example":"あの店はサービスがいいです。","exampleVi":"Cửa hàng kia phục vụ tốt.","note":"Ở Nhật サービス còn nghĩa 'miễn phí, khuyến mãi': これはサービスです = cái này tặng anh.","deck":"初級 13"},{"type":"vocab","word":"相撲","reading":"すもう","meaning":"sumo","pos":"danh từ","lesson":"Dekiru 13","example":"相撲を見たことがありますか。","exampleVi":"Bạn đã xem sumo bao giờ chưa?","note":"TƯƠNG BỘC. Xem sumo dùng 見る, tập sumo dùng 取る: 相撲を取る.","deck":"初級 13"},{"type":"vocab","word":"ホテル","reading":"ホテル","meaning":"khách sạn","pos":"danh từ","lesson":"Dekiru 13","example":"駅の近くのホテルに泊まりました。","exampleVi":"Tôi đã nghỉ ở khách sạn gần ga.","note":"Nghỉ lại thì dùng 泊まる + に, không dùng 寝る.","deck":"初級 13"},{"type":"vocab","word":"知ります［知る］","reading":"しります","meaning":"biết","pos":"động từ nhóm I","lesson":"Dekiru 13","example":"あの人の名前を知っていますか。","exampleVi":"Bạn có biết tên người kia không?","note":"TRI. Bẫy kinh điển: khẳng định 知っています nhưng phủ định là 知りません.","deck":"初級 13"},{"type":"vocab","word":"デートします［デートする］","reading":"デートします","meaning":"hẹn hò","pos":"động từ nhóm III","lesson":"Dekiru 13","example":"日曜日に彼女とデートします。","exampleVi":"Chủ nhật tôi hẹn hò với bạn gái.","note":"Đi cùng ai dùng と.","deck":"初級 13"},{"type":"vocab","word":"１回も","reading":"いっかいも","meaning":"một lần cũng (không)","pos":"cụm từ","lesson":"Dekiru 13","example":"お寿司は一回も食べたことがありません。","exampleVi":"Tôi chưa ăn sushi lần nào.","note":"Luôn đi với phủ định. Khẳng định thì dùng 一回だけ (chỉ một lần). Luôn đi với phủ định: 一回も行ったことがない","deck":"初級 13"},{"type":"vocab","word":"何回も","reading":"なんかいも","meaning":"rất nhiều lần","pos":"cụm từ","lesson":"Dekiru 13","example":"この映画は何回も見ました。","exampleVi":"Phim này tôi xem đi xem lại nhiều lần.","note":"何回も = nhiều lần; 何回か = vài lần; 何回 + か? = hỏi mấy lần.","deck":"初級 13"},{"type":"vocab","word":"男の人","reading":"おとこのひと","meaning":"đàn ông","pos":"danh từ","lesson":"Dekiru 13","example":"あの男の人は日本人だと思います。","exampleVi":"Tôi nghĩ người đàn ông kia là người Nhật.","note":"Lịch sự hơn thì nói 男性（だんせい）.","deck":"初級 13"},{"type":"vocab","word":"女の人","reading":"おんなのひと","meaning":"phụ nữ","pos":"danh từ","lesson":"Dekiru 13","example":"赤い服を着ている女の人は姉です。","exampleVi":"Người phụ nữ mặc áo đỏ là chị tôi.","note":"Lịch sự hơn thì nói 女性（じょせい）.","deck":"初級 13"},{"type":"vocab","word":"（お）店","reading":"（お）みせ","meaning":"cửa hàng","pos":"danh từ","lesson":"Dekiru 13","example":"この店はいつも込んでいます。","exampleVi":"Quán này lúc nào cũng đông.","note":"ĐIẾM. Thêm お cho lịch sự khi nói về quán của người khác.","deck":"初級 13"},{"type":"vocab","word":"遊園地","reading":"ゆうえんち","meaning":"khu vui chơi","pos":"danh từ","lesson":"Dekiru 13","example":"子どもと遊園地へ行きました。","exampleVi":"Tôi đã đưa con đi khu vui chơi.","note":"DU VIÊN ĐỊA = chơi + vườn + đất. Ba chữ ghép ra nghĩa luôn.","deck":"初級 13"},{"type":"vocab","word":"ジェットコースター","reading":"ジェットコースター","meaning":"tàu lượn siêu tốc","pos":"danh từ","lesson":"Dekiru 13","example":"ジェットコースターは怖いですが、おもしろいです。","exampleVi":"Tàu lượn thì đáng sợ nhưng thú vị.","note":"Tiếng Anh gốc là roller coaster — đây là từ chế kiểu Nhật (和製英語).","deck":"初級 13"},{"type":"vocab","word":"電気製品","reading":"でんきせいひん","meaning":"đồ điện, hàng điện tử","pos":"danh từ","lesson":"Dekiru 13","example":"秋葉原で電気製品を買いました。","exampleVi":"Tôi mua đồ điện tử ở Akihabara.","note":"ĐIỆN KHÍ CHẾ PHẨM. Hậu tố 〜製品 = sản phẩm: 日本製品 = hàng Nhật.","deck":"初級 13"},{"type":"vocab","word":"サングラス","reading":"サングラス","meaning":"kính râm","pos":"danh từ","lesson":"Dekiru 13","example":"夏はサングラスをかけます。","exampleVi":"Mùa hè tôi đeo kính râm.","note":"Đeo kính dùng かける, giống 眼鏡.","deck":"初級 13"},{"type":"vocab","word":"眼鏡","reading":"めがね","meaning":"kính (mắt)","pos":"danh từ","lesson":"Dekiru 13","example":"父は眼鏡をかけています。","exampleVi":"Bố tôi đang đeo kính.","note":"NHÃN KÍNH. Thường viết kana めがね. Đeo dùng かける, không dùng する. 眼鏡をかけます","deck":"初級 13"},{"type":"vocab","word":"シャツ","reading":"シャツ","meaning":"áo sơ mi","pos":"danh từ","lesson":"Dekiru 13","example":"白いシャツを着て、会社へ行きます。","exampleVi":"Tôi mặc áo sơ mi trắng đi làm.","note":"Áo phông là Tシャツ, áo sơ mi công sở là ワイシャツ.","deck":"初級 13"},{"type":"vocab","word":"スカート","reading":"スカート","meaning":"váy, chân váy","pos":"danh từ","lesson":"Dekiru 13","example":"妹は短いスカートをはいています。","exampleVi":"Em gái tôi đang mặc váy ngắn.","note":"Váy dùng はく chứ không dùng 着る — vì mặc từ hông xuống.","deck":"初級 13"},{"type":"vocab","word":"ネクタイ","reading":"ネクタイ","meaning":"cà vạt","pos":"danh từ","lesson":"Dekiru 13","example":"会議の日はネクタイをします。","exampleVi":"Ngày họp thì tôi thắt cà vạt.","note":"Cà vạt dùng する (hoặc 締める), không dùng 着る. ネクタイをします","deck":"初級 13"},{"type":"vocab","word":"帽子","reading":"ぼうし","meaning":"mũ, nón","pos":"danh từ","lesson":"Dekiru 13","example":"帽子をかぶって、出かけました。","exampleVi":"Tôi đội mũ rồi đi ra ngoài.","note":"MẠO TỬ. Đội lên đầu thì dùng かぶる. 帽子をかぶります","deck":"初級 13"},{"type":"vocab","word":"人気","reading":"にんき","meaning":"sự nổi tiếng, được ưa chuộng","pos":"danh từ","lesson":"Dekiru 13","example":"この歌手は若い人に人気があります。","exampleVi":"Ca sĩ này được giới trẻ yêu thích.","note":"NHÂN KHÍ. Mẫu cố định: 〜に人気があります. Đọc にんき, không phải ひとけ.","deck":"初級 13"},{"type":"vocab","word":"売ります［売る］","reading":"うります","meaning":"bán","pos":"động từ nhóm I","lesson":"Dekiru 13","example":"あの店で切手を売っています。","exampleVi":"Cửa hàng kia có bán tem.","note":"MÃI (bán). Cặp đối lập 売る ↔ 買う. Đang bán thì dùng 売っています.","deck":"初級 13"},{"type":"vocab","word":"かぶります［かぶる］","reading":"かぶります","meaning":"đội (mũ)","pos":"động từ nhóm I","lesson":"Dekiru 13","example":"暑いですから、帽子をかぶってください。","exampleVi":"Trời nắng, hãy đội mũ vào.","note":"Bộ tứ động từ mặc: かぶる đầu, 着る thân, はく chân, する phụ kiện.","deck":"初級 13"},{"type":"vocab","word":"泊まります［泊まる］","reading":"とまります","meaning":"trọ lại, nghỉ lại","pos":"động từ nhóm I","lesson":"Dekiru 13","example":"友だちの家に泊まりました。","exampleVi":"Tôi ngủ lại nhà bạn.","note":"BẠC. Chỗ trọ đi với に. Đừng nhầm với 止まります (dừng lại).","deck":"初級 13"},{"type":"vocab","word":"はきます［はく］","reading":"はきます","meaning":"đi (giày, tất), mặc (quần, váy)","pos":"động từ nhóm I","lesson":"Dekiru 13","example":"靴をはいて、外に出ます。","exampleVi":"Tôi đi giày rồi ra ngoài.","note":"Dùng cho quần, váy, giày, tất — tất cả những gì mặc từ hông xuống.","deck":"初級 13"},{"type":"vocab","word":"かけます［かける］","reading":"かけます","meaning":"đeo (kính); treo","pos":"động từ nhóm II","lesson":"Dekiru 13","example":"眼鏡をかけると、よく見えます。","exampleVi":"Đeo kính vào là nhìn rõ.","note":"かける nhiều nghĩa nhất tiếng Nhật: đeo kính, gọi điện (電話をかける), treo, ngồi (いすにかける). 眼鏡をかけます","deck":"初級 13"},{"type":"vocab","word":"着ます［着る］","reading":"きます","meaning":"mặc (từ vai xuống)","pos":"động từ nhóm II","lesson":"Dekiru 13","example":"今日は青いシャツを着ています。","exampleVi":"Hôm nay tôi mặc áo sơ mi xanh.","note":"TRƯỚC. Nhóm 2. Đừng nhầm với 切る (cắt, nhóm 1) — cùng đọc きる. Đừng nhầm với 切ります (cắt, nhóm 1)","deck":"初級 13"},{"type":"vocab","word":"します［する］","reading":"します","meaning":"đeo, thắt (phụ kiện)","pos":"động từ nhóm III","lesson":"Dekiru 13","example":"時計をして、出かけます。","exampleVi":"Tôi đeo đồng hồ rồi đi.","note":"Dùng cho phụ kiện: ネクタイ, 時計, 指輪, コンタクトレンズ. ネクタイをします, 時計をします","deck":"初級 13"},{"type":"vocab","word":"青い","reading":"あおい","meaning":"xanh (lam)","pos":"tính từ -i","lesson":"Dekiru 13","example":"空が青くて、きれいです。","exampleVi":"Bầu trời xanh và đẹp.","note":"THANH. Tiếng Nhật 青 phủ cả xanh lam lẫn xanh lá cây: 青信号 = đèn xanh.","deck":"初級 13"},{"type":"vocab","word":"赤い","reading":"あかい","meaning":"đỏ","pos":"tính từ -i","lesson":"Dekiru 13","example":"赤いりんごを三つ買いました。","exampleVi":"Tôi mua ba quả táo đỏ.","note":"XÍCH. Nhớ chung với 赤ちゃん (em bé) — đứa bé đỏ hỏn.","deck":"初級 13"},{"type":"vocab","word":"黄色い","reading":"きいろい","meaning":"vàng","pos":"tính từ -i","lesson":"Dekiru 13","example":"黄色い花が咲いています。","exampleVi":"Hoa vàng đang nở.","note":"HOÀNG SẮC. Chú ý đây là tính từ -i, khác 緑 và 紫 là danh từ.","deck":"初級 13"},{"type":"vocab","word":"若い","reading":"わかい","meaning":"trẻ","pos":"tính từ -i","lesson":"Dekiru 13","example":"社長はまだ若いです。","exampleVi":"Giám đốc còn trẻ.","note":"NHƯỢC. Trái nghĩa với 年を取っている, không phải với 古い.","deck":"初級 13"},{"type":"vocab","word":"新鮮（な）","reading":"しんせん（な）","meaning":"tươi, mới","pos":"tính từ -na","lesson":"Dekiru 13","example":"この魚は新鮮でおいしいです。","exampleVi":"Con cá này tươi và ngon.","note":"TÂN TIÊN. Dùng cho thực phẩm và không khí, không dùng cho đồ vật (đồ mới là 新しい).","deck":"初級 13"},{"type":"vocab","word":"材料","reading":"ざいりょう","meaning":"nguyên liệu, vật liệu","pos":"danh từ","lesson":"Dekiru 13","example":"カレーの材料を買いに行きます。","exampleVi":"Tôi đi mua nguyên liệu nấu cà ri.","note":"TÀI LIỆU — nhưng nghĩa Nhật là nguyên vật liệu, không phải 'tài liệu giấy tờ' (cái đó là 資料). Sách dịch là 'tài liệu' — trong ngữ cảnh nấu ăn phải hiểu là nguyên liệu","deck":"初級 13"},{"type":"vocab","word":"場所","reading":"ばしょ","meaning":"địa điểm, chỗ","pos":"danh từ","lesson":"Dekiru 13","example":"待ち合わせの場所はどこですか。","exampleVi":"Chỗ hẹn là ở đâu?","note":"TRƯỜNG SỞ = nơi chốn. Cùng chữ 場 với 入場料, 会場.","deck":"初級 13"},{"type":"vocab","word":"バスケットボール","reading":"バスケットボール","meaning":"bóng rổ","pos":"danh từ","lesson":"Dekiru 13","example":"週末に友だちとバスケットボールをします。","exampleVi":"Cuối tuần tôi chơi bóng rổ với bạn.","note":"Nói tắt là バスケ. Chơi thể thao dùng をします.","deck":"初級 13"},{"type":"vocab","word":"浴衣","reading":"ゆかた","meaning":"yukata (kimono mùa hè)","pos":"danh từ","lesson":"Dekiru 13","example":"花火大会に浴衣を着て行きます。","exampleVi":"Tôi mặc yukata đi lễ hội pháo hoa.","note":"DỤC Y = áo mặc sau khi tắm. Nhẹ hơn kimono, mặc mùa hè.","deck":"初級 13"},{"type":"vocab","word":"どこか","reading":"どこか","meaning":"chỗ nào đó","pos":"đại từ","lesson":"Dekiru 13","example":"週末にどこかへ行きませんか。","exampleVi":"Cuối tuần đi đâu đó không?","note":"Bộ ba: どこか (đâu đó), だれか (ai đó), なにか (cái gì đó). Trợ từ へ／に đứng sau か.","deck":"初級 13"},{"type":"vocab","word":"練習します［練習する］","reading":"れんしゅうします","meaning":"luyện tập","pos":"động từ nhóm III","lesson":"Dekiru 13","example":"毎日、日本語を練習しています。","exampleVi":"Ngày nào tôi cũng luyện tiếng Nhật.","note":"LUYỆN TẬP — trùng khít tiếng Việt.","deck":"初級 13"},{"type":"vocab","word":"みんなで","reading":"みんなで","meaning":"cùng mọi người","pos":"cụm từ","lesson":"Dekiru 13","example":"みんなで写真を撮りましょう。","exampleVi":"Cả nhóm mình chụp ảnh chung nào.","note":"みんなで = cùng nhau làm; みんなが = tất cả mọi người (làm chủ ngữ).","deck":"初級 13"},{"type":"vocab","word":"うどん","reading":"うどん","meaning":"mì udon","pos":"danh từ","lesson":"Dekiru 14","example":"寒い日はうどんが食べたくなります。","exampleVi":"Ngày lạnh là tôi thèm ăn udon.","note":"Sợi dày, làm từ bột mì. Đếm bằng 杯: うどんを一杯.","deck":"初級 14"},{"type":"vocab","word":"そば","reading":"そば","meaning":"mì soba","pos":"danh từ","lesson":"Dekiru 14","example":"大晦日に年越しそばを食べます。","exampleVi":"Đêm giao thừa người Nhật ăn mì soba.","note":"Sợi mảnh màu nâu, làm từ kiều mạch. 年越しそば là phong tục đón năm mới.","deck":"初級 14"},{"type":"vocab","word":"カイロ","reading":"カイロ","meaning":"miếng dán giữ nhiệt","pos":"danh từ","lesson":"Dekiru 14","example":"冬はポケットにカイロを入れます。","exampleVi":"Mùa đông tôi bỏ miếng giữ nhiệt vào túi.","note":"Gốc chữ Hán 懐炉 = hoài lô, 'lò sưởi trong ngực áo'. Mua đầy ở konbini mùa đông.","deck":"初級 14"},{"type":"vocab","word":"こたつ","reading":"こたつ","meaning":"bàn sưởi kotatsu","pos":"danh từ","lesson":"Dekiru 14","example":"こたつに入ると、出たくなくなります。","exampleVi":"Chui vào kotatsu rồi là không muốn ra nữa.","note":"Bàn có chăn phủ và lò sưởi bên dưới. Dùng 入る giống お風呂.","deck":"初級 14"},{"type":"vocab","word":"字","reading":"じ","meaning":"chữ, ký tự","pos":"danh từ","lesson":"Dekiru 14","example":"この字は何と読みますか。","exampleVi":"Chữ này đọc là gì?","note":"TỰ. Chữ đẹp là 字がきれい, chữ xấu là 字が下手.","deck":"初級 14"},{"type":"vocab","word":"食券","reading":"しょっけん","meaning":"phiếu ăn","pos":"danh từ","lesson":"Dekiru 14","example":"入り口の機械で食券を買います。","exampleVi":"Mua phiếu ăn ở máy trước cửa.","note":"THỰC KHOÁN = phiếu ăn. Quán mì rẻ ở Nhật đều mua vé ở máy trước khi ngồi. Mua ở máy bán vé trước cửa quán ăn","deck":"初級 14"},{"type":"vocab","word":"（お）釣り","reading":"（お）つり","meaning":"tiền thừa, tiền thối","pos":"danh từ","lesson":"Dekiru 14","example":"お釣りは要りません。","exampleVi":"Không cần trả lại tiền thừa đâu.","note":"釣る là 'câu cá' — tiền thừa được 'câu' ngược lại cho khách.","deck":"初級 14"},{"type":"vocab","word":"電気","reading":"でんき","meaning":"điện; đèn","pos":"danh từ","lesson":"Dekiru 14","example":"寝る前に電気を消してください。","exampleVi":"Trước khi ngủ hãy tắt đèn.","note":"ĐIỆN KHÍ. Vừa nghĩa 'điện' vừa nghĩa 'đèn'. Bật là つける, tắt là 消す. 電気をつけます／消します","deck":"初級 14"},{"type":"vocab","word":"ドア","reading":"ドア","meaning":"cửa ra vào","pos":"danh từ","lesson":"Dekiru 14","example":"風でドアが閉まりました。","exampleVi":"Gió làm cửa đóng lại.","note":"Cửa kiểu Tây mở ra vào; cửa trượt kiểu Nhật là 戸 hoặc 引き戸.","deck":"初級 14"},{"type":"vocab","word":"唐辛子","reading":"とうがらし","meaning":"ớt","pos":"danh từ","lesson":"Dekiru 14","example":"唐辛子を入れると、辛くなります。","exampleVi":"Cho ớt vào là cay lên.","note":"ĐƯỜNG TÂN TỬ = hạt cay từ nhà Đường. Bột ớt bảy vị nổi tiếng là 七味唐辛子.","deck":"初級 14"},{"type":"vocab","word":"風鈴","reading":"ふうりん","meaning":"chuông gió","pos":"danh từ","lesson":"Dekiru 14","example":"夏になると、風鈴の音が聞こえます。","exampleVi":"Đến hè là nghe tiếng chuông gió.","note":"PHONG LINH = chuông gió. Hai chữ Hán ra đúng nghĩa.","deck":"初級 14"},{"type":"vocab","word":"布団","reading":"ふとん","meaning":"chăn, nệm futon","pos":"danh từ","lesson":"Dekiru 14","example":"毎朝、布団をたたみます。","exampleVi":"Sáng nào tôi cũng gấp chăn đệm.","note":"BỐ ĐOÀN. Trải ra là 布団を敷く, gấp lại là たたむ.","deck":"初級 14"},{"type":"vocab","word":"ポケット","reading":"ポケット","meaning":"túi áo, túi quần","pos":"danh từ","lesson":"Dekiru 14","example":"ポケットに手を入れないでください。","exampleVi":"Đừng cho tay vào túi quần.","note":"Từ mượn tiếng Anh pocket.","deck":"初級 14"},{"type":"vocab","word":"ボタン","reading":"ボタン","meaning":"nút bấm; khuy áo","pos":"danh từ","lesson":"Dekiru 14","example":"赤いボタンを押してください。","exampleVi":"Hãy nhấn nút màu đỏ.","note":"Vừa là nút bấm vừa là khuy áo. Nút bấm dùng 押す, khuy áo dùng かける／外す.","deck":"初級 14"},{"type":"vocab","word":"（お）湯","reading":"（お）ゆ","meaning":"nước nóng","pos":"danh từ","lesson":"Dekiru 14","example":"お湯を沸かして、お茶を作ります。","exampleVi":"Tôi đun nước sôi để pha trà.","note":"THANG. Nước nóng là お湯, nước lạnh là 水 — tiếng Nhật tách hẳn hai từ. Nước lạnh là 水","deck":"初級 14"},{"type":"vocab","word":"湯たんぽ","reading":"ゆたんぽ","meaning":"túi chườm nóng","pos":"danh từ","lesson":"Dekiru 14","example":"寒い夜は湯たんぽを使います。","exampleVi":"Đêm lạnh tôi dùng túi chườm nóng.","note":"湯 (nước nóng) + 湯婆 — cái túi đổ nước nóng để trong chăn.","deck":"初級 14"},{"type":"vocab","word":"レバー","reading":"レバー","meaning":"cần gạt, đòn bẩy","pos":"danh từ","lesson":"Dekiru 14","example":"このレバーを下に回してください。","exampleVi":"Hãy xoay cần gạt này xuống dưới.","note":"Đồng âm với レバー (gan, món ăn) — phân biệt bằng ngữ cảnh.","deck":"初級 14"},{"type":"vocab","word":"開きます［開く］","reading":"あきます","meaning":"(cửa) mở ra","pos":"động từ nhóm I","lesson":"Dekiru 14","example":"自動ドアが開きました。","exampleVi":"Cửa tự động đã mở.","note":"KHAI. Tự động từ, đi với が. Tha động từ là 開けます: ドアを開けます.","deck":"初級 14"},{"type":"vocab","word":"座ります［座る］","reading":"すわります","meaning":"ngồi","pos":"động từ nhóm I","lesson":"Dekiru 14","example":"どうぞ、こちらに座ってください。","exampleVi":"Xin mời ngồi bên này.","note":"TOẠ. Chỗ ngồi đi với に. Trái nghĩa: 立ちます.","deck":"初級 14"},{"type":"vocab","word":"つきます［つく］","reading":"つきます","meaning":"(đèn, máy) bật, sáng","pos":"động từ nhóm I","lesson":"Dekiru 14","example":"スイッチを押すと、電気がつきます。","exampleVi":"Bấm công tắc là đèn sáng.","note":"Tự động từ, đi với が. Tha động từ là つけます. Cặp với 消えます／消します.","deck":"初級 14"},{"type":"vocab","word":"回します［回す］","reading":"まわします","meaning":"xoay, vặn","pos":"động từ nhóm I","lesson":"Dekiru 14","example":"ハンドルを右に回してください。","exampleVi":"Hãy xoay tay lái sang phải.","note":"HỒI. Tha động từ, đi với を. Tự động từ là 回ります (tự quay).","deck":"初級 14"},{"type":"vocab","word":"出ます［出る］","reading":"でます","meaning":"(nước, tiền) chảy ra, trào ra","pos":"động từ nhóm II","lesson":"Dekiru 14","example":"ボタンを押すと、お釣りが出ます。","exampleVi":"Bấm nút là tiền thừa trả ra.","note":"XUẤT. Tự động từ đi với が／を. Cặp: 出る (tự ra) ↔ 出す (đưa ra). お釣りが出ます = tiền thừa trả ra","deck":"初級 14"},{"type":"vocab","word":"あれ？","reading":"あれ？","meaning":"ơ? gì vậy nhỉ?","pos":"thán từ","lesson":"Dekiru 14","example":"あれ？かぎがありませんね。","exampleVi":"Ơ? Không thấy chìa khoá đâu nhỉ.","note":"Thán từ khi phát hiện chuyện bất ngờ. Nói nhiều ở đời thường.","deck":"初級 14"},{"type":"vocab","word":"いただきます。","reading":"いただきます","meaning":"xin mời (trước khi ăn)","pos":"cụm từ","lesson":"Dekiru 14","example":"「いただきます。」と言ってから食べます。","exampleVi":"Nói 'itadakimasu' rồi mới ăn.","note":"Nghĩa gốc là 'tôi xin nhận'. Bắt buộc nói trước bữa, kể cả ăn một mình.","deck":"初級 14"},{"type":"vocab","word":"おなかがいっぱいです。","reading":"おなかがいっぱいです","meaning":"no rồi","pos":"cụm từ","lesson":"Dekiru 14","example":"もうおなかがいっぱいです。","exampleVi":"Tôi no rồi.","note":"Cách từ chối lịch sự khi được mời thêm. Trái nghĩa: おなかがすきました (đói).","deck":"初級 14"},{"type":"vocab","word":"ごちそうさまでした。","reading":"ごちそうさまでした","meaning":"cảm ơn vì bữa ăn","pos":"cụm từ","lesson":"Dekiru 14","example":"「ごちそうさまでした。おいしかったです。」","exampleVi":"\"Cảm ơn vì bữa ăn, ngon lắm ạ.\"","note":"ごちそう = món thết đãi. Nói sau khi ăn xong, đặc biệt khi người khác trả tiền.","deck":"初級 14"},{"type":"vocab","word":"以下","reading":"いか","meaning":"dưới đây, trở xuống","pos":"danh từ","lesson":"Dekiru 14","example":"十八歳以下の人は入れません。","exampleVi":"Người từ 18 tuổi trở xuống không được vào.","note":"DĨ HẠ. Cặp với 以上. Cả hai đều bao gồm chính con số đó.","deck":"初級 14"},{"type":"vocab","word":"玄関","reading":"げんかん","meaning":"lối vào nhà, chỗ cởi giày","pos":"danh từ","lesson":"Dekiru 14","example":"玄関で靴を脱いでください。","exampleVi":"Hãy cởi giày ở lối vào.","note":"HUYỀN QUAN. Không gian đặc trưng nhà Nhật — cửa vào có bậc, cởi giày tại đó.","deck":"初級 14"},{"type":"vocab","word":"シートベルト","reading":"シートベルト","meaning":"dây an toàn","pos":"danh từ","lesson":"Dekiru 14","example":"車に乗ったら、シートベルトをしてください。","exampleVi":"Lên xe thì hãy thắt dây an toàn.","note":"Thắt dùng する hoặc 締める（しめる）. シートベルトを締めます","deck":"初級 14"},{"type":"vocab","word":"ヘルメット","reading":"ヘルメット","meaning":"mũ bảo hiểm","pos":"danh từ","lesson":"Dekiru 14","example":"バイクに乗るとき、ヘルメットをかぶります。","exampleVi":"Khi đi xe máy phải đội mũ bảo hiểm.","note":"Đội lên đầu nên dùng かぶる.","deck":"初級 14"},{"type":"vocab","word":"パスポート","reading":"パスポート","meaning":"hộ chiếu","pos":"danh từ","lesson":"Dekiru 14","example":"パスポートを見せてください。","exampleVi":"Xin cho xem hộ chiếu.","note":"Từ bạn sẽ nghe ở sân bay Nhật. 見せる = cho xem, khác 見る.","deck":"初級 14"},{"type":"vocab","word":"身分証","reading":"みぶんしょう","meaning":"giấy tờ tuỳ thân","pos":"danh từ","lesson":"Dekiru 14","example":"身分証を持ってきましたか。","exampleVi":"Bạn có mang giấy tờ tuỳ thân không?","note":"THÂN PHẬN CHỨNG. Ở Nhật thẻ 在留カード chính là giấy tờ tuỳ thân của bạn.","deck":"初級 14"},{"type":"vocab","word":"料金","reading":"りょうきん","meaning":"phí, cước","pos":"danh từ","lesson":"Dekiru 14","example":"この料金には税金が入っています。","exampleVi":"Giá này đã bao gồm thuế.","note":"LIỆU KIM. Cùng chữ 料 với 入場料, 送料, 無料.","deck":"初級 14"},{"type":"vocab","word":"入場料","reading":"にゅうじょうりょう","meaning":"phí vào cửa","pos":"danh từ","lesson":"Dekiru 14","example":"入場料は千円です。","exampleVi":"Phí vào cửa là 1000 yên.","note":"NHẬP TRƯỜNG LIỆU = vào + chỗ + phí. Ba chữ ghép ra đúng nghĩa.","deck":"初級 14"},{"type":"vocab","word":"並びます［並ぶ］","reading":"ならびます","meaning":"xếp hàng","pos":"động từ nhóm I","lesson":"Dekiru 14","example":"みんな並んで待っています。","exampleVi":"Mọi người đang xếp hàng đợi.","note":"Tự động từ, đi với が. Tha động từ là 並べます (xếp đồ ra bàn).","deck":"初級 14"},{"type":"vocab","word":"止めます［止める］","reading":"とめます","meaning":"dừng, đỗ (xe)","pos":"động từ nhóm II","lesson":"Dekiru 14","example":"ここに車を止めないでください。","exampleVi":"Đừng đỗ xe ở đây.","note":"CHỈ. Tha động từ, đi với を. Tự động từ là 止まります.","deck":"初級 14"},{"type":"vocab","word":"分けます［分ける］","reading":"わけます","meaning":"chia, phân loại","pos":"động từ nhóm II","lesson":"Dekiru 14","example":"ごみを分けて捨ててください。","exampleVi":"Hãy phân loại rác rồi mới bỏ.","note":"PHÂN. Phân loại rác ở Nhật rất nghiêm, sai là bị trả lại túi. ごみを分けます = phân loại rác","deck":"初級 14"},{"type":"vocab","word":"きちんと","reading":"きちんと","meaning":"chỉn chu, đàng hoàng","pos":"phó từ","lesson":"Dekiru 14","example":"靴をきちんと並べてください。","exampleVi":"Hãy xếp giày cho ngay ngắn.","note":"Trạng từ chỉ sự chỉn chu, đúng quy củ. Gần nghĩa: ちゃんと.","deck":"初級 14"},{"type":"vocab","word":"そうなんですか。","reading":"そうなんですか","meaning":"vậy à?","pos":"cụm từ","lesson":"Dekiru 14","example":"「日本は初めてです。」「そうなんですか。」","exampleVi":"\"Lần đầu tôi đến Nhật.\" \"Vậy à.\"","note":"Câu đệm thể hiện mình đang nghe. Nói nhiều trong hội thoại công sở.","deck":"初級 14"},{"type":"vocab","word":"ほら","reading":"ほら","meaning":"này, nhìn này!","pos":"thán từ","lesson":"Dekiru 14","example":"ほら、富士山が見えますよ。","exampleVi":"Này, nhìn kìa, thấy núi Phú Sĩ rồi.","note":"Dùng để kéo sự chú ý của người khác. Suồng sã, không dùng với cấp trên.","deck":"初級 14"},{"type":"vocab","word":"田舎","reading":"いなか","meaning":"quê, nông thôn","pos":"danh từ","lesson":"Dekiru 14","example":"わたしの田舎は海の近くです。","exampleVi":"Quê tôi ở gần biển.","note":"ĐIỀN XÁ = ruộng + nhà. Đọc いなか, hoàn toàn bất quy tắc — phải thuộc lòng.","deck":"初級 14"},{"type":"vocab","word":"都会","reading":"とかい","meaning":"thành thị","pos":"danh từ","lesson":"Dekiru 14","example":"都会の生活は便利ですが、疲れます。","exampleVi":"Sống ở thành phố tiện nhưng mệt.","note":"ĐÔ HỘI. Trái nghĩa với 田舎.","deck":"初級 14"},{"type":"vocab","word":"空気","reading":"くうき","meaning":"không khí","pos":"danh từ","lesson":"Dekiru 14","example":"田舎は空気がきれいです。","exampleVi":"Ở quê không khí trong lành.","note":"KHÔNG KHÍ — trùng khít tiếng Việt. Còn nghĩa bóng: 空気を読む = đọc không khí, hiểu ý.","deck":"初級 14"},{"type":"vocab","word":"交通","reading":"こうつう","meaning":"giao thông","pos":"danh từ","lesson":"Dekiru 14","example":"東京は交通が便利です。","exampleVi":"Tokyo giao thông thuận tiện.","note":"GIAO THÔNG — cho không luôn. 交通費 = tiền đi lại, công ty Nhật thường trả khoản này.","deck":"初級 14"},{"type":"vocab","word":"時給","reading":"じきゅう","meaning":"lương theo giờ","pos":"danh từ","lesson":"Dekiru 14","example":"このアルバイトは時給千二百円です。","exampleVi":"Việc làm thêm này lương 1200 yên một giờ.","note":"THỜI CẤP = giờ + cấp. Từ đầu tiên bạn tra khi tìm baito ở Nhật. Từ bắt buộc biết khi đi làm baito ở Nhật","deck":"初級 14"},{"type":"vocab","word":"自由","reading":"じゆう","meaning":"tự do","pos":"danh từ / tính từ -na","lesson":"Dekiru 14","example":"フリープランは自由な時間が多いです。","exampleVi":"Tour tự do có nhiều thời gian rảnh.","note":"TỰ DO — trùng khít. Là tính từ -na: 自由な時間.","deck":"初級 14"},{"type":"vocab","word":"デザイン","reading":"デザイン","meaning":"thiết kế","pos":"danh từ","lesson":"Dekiru 14","example":"この電話はデザインがいいです。","exampleVi":"Chiếc điện thoại này thiết kế đẹp.","note":"Danh từ, nhưng ghép する thành động từ: デザインします.","deck":"初級 14"},{"type":"vocab","word":"番組","reading":"ばんぐみ","meaning":"chương trình (TV, radio)","pos":"danh từ","lesson":"Dekiru 14","example":"好きなテレビ番組は何ですか。","exampleVi":"Chương trình TV bạn thích là gì?","note":"PHIÊN TỔ. Chỉ dùng cho chương trình phát sóng, không dùng cho lịch trình (cái đó là 予定).","deck":"初級 14"},{"type":"vocab","word":"ファストフード","reading":"ファストフード","meaning":"đồ ăn nhanh","pos":"danh từ","lesson":"Dekiru 14","example":"忙しいとき、ファストフードを食べます。","exampleVi":"Lúc bận tôi ăn đồ ăn nhanh.","note":"Có khi viết ファーストフード, cả hai đều gặp.","deck":"初級 14"},{"type":"vocab","word":"ファッション","reading":"ファッション","meaning":"thời trang","pos":"danh từ","lesson":"Dekiru 14","example":"彼女はファッションに興味があります。","exampleVi":"Cô ấy quan tâm đến thời trang.","note":"Mẫu 〜に興味があります = có hứng thú với ~.","deck":"初級 14"},{"type":"vocab","word":"フリープラン","reading":"フリープラン","meaning":"tour tự do (chỉ gồm vé và khách sạn)","pos":"danh từ","lesson":"Dekiru 14","example":"フリープランで京都へ行きました。","exampleVi":"Tôi đi Kyoto theo tour tự do.","note":"Từ chế kiểu Nhật: công ty du lịch chỉ lo vé và khách sạn, còn lại khách tự đi.","deck":"初級 14"},{"type":"vocab","word":"思います［思う］","reading":"おもいます","meaning":"nghĩ rằng, cho rằng","pos":"động từ nhóm I","lesson":"Dekiru 14","example":"この店はおいしいと思います。","exampleVi":"Tôi nghĩ quán này ngon.","note":"TƯ. Mẫu 〜と思います. Nói suy nghĩ của người khác phải dùng 〜と思っています.","deck":"初級 14"},{"type":"vocab","word":"化粧します［化粧する］","reading":"けしょうします","meaning":"trang điểm","pos":"động từ nhóm III","lesson":"Dekiru 14","example":"毎朝、化粧してから出かけます。","exampleVi":"Sáng nào cũng trang điểm rồi mới ra ngoài.","note":"HOÁ TRANG = biến hoá + trang sức. Nhà vệ sinh còn gọi là お化粧室.","deck":"初級 14"},{"type":"vocab","word":"経験します［経験する］","reading":"けいけんします","meaning":"trải nghiệm","pos":"động từ nhóm III","lesson":"Dekiru 14","example":"日本で地震を経験しました。","exampleVi":"Tôi đã trải qua động đất ở Nhật.","note":"KINH NGHIỆM — trùng khít. Danh từ 経験 dùng nhiều trong CV: 開発経験 = kinh nghiệm phát triển.","deck":"初級 14"},{"type":"vocab","word":"うるさい","reading":"うるさい","meaning":"ồn ào, ầm ĩ","pos":"tính từ -i","lesson":"Dekiru 14","example":"隣の部屋がうるさくて、眠れません。","exampleVi":"Phòng bên ồn quá, tôi không ngủ được.","note":"Còn nghĩa 'khó tính, hay càm ràm': 母は食べ物にうるさい.","deck":"初級 14"},{"type":"vocab","word":"おしゃれ（な）","reading":"おしゃれ（な）","meaning":"sành điệu, ăn diện","pos":"tính từ -na","lesson":"Dekiru 14","example":"彼はいつもおしゃれな服を着ています。","exampleVi":"Anh ấy lúc nào cũng mặc đồ sành điệu.","note":"Vừa là tính từ -na vừa là danh từ: おしゃれをする = chưng diện.","deck":"初級 14"},{"type":"vocab","word":"複雑（な）","reading":"ふくざつ（な）","meaning":"phức tạp","pos":"tính từ -na","lesson":"Dekiru 14","example":"この機械の使い方は複雑です。","exampleVi":"Cách dùng máy này phức tạp.","note":"PHỨC TẠP — trùng khít. Trái nghĩa: 簡単（な）.","deck":"初級 14"},{"type":"vocab","word":"便利（な）","reading":"べんり（な）","meaning":"tiện lợi","pos":"tính từ -na","lesson":"Dekiru 14","example":"駅が近くて便利です。","exampleVi":"Gần ga nên tiện lắm.","note":"TIỆN LỢI — trùng khít. Cùng chữ 便 với 郵便, 不便.","deck":"初級 14"},{"type":"vocab","word":"不便（な）","reading":"ふべん（な）","meaning":"bất tiện","pos":"tính từ -na","lesson":"Dekiru 14","example":"バスがなくて不便です。","exampleVi":"Không có xe buýt nên bất tiện.","note":"BẤT TIỆN. Cứ thêm 不 vào 便利 là lật ngược nghĩa, giống 安心 ↔ 不安. 便利 thêm 不 là lật ngược nghĩa","deck":"初級 14"},{"type":"vocab","word":"いつでも","reading":"いつでも","meaning":"bất cứ lúc nào","pos":"phó từ","lesson":"Dekiru 14","example":"いつでも連絡してください。","exampleVi":"Cứ liên lạc với tôi bất cứ lúc nào.","note":"Bộ: いつでも (lúc nào cũng được), どこでも, だれでも, なんでも.","deck":"初級 14"},{"type":"vocab","word":"うーん","reading":"うーん","meaning":"ừm... (từ đệm khi phân vân)","pos":"thán từ","lesson":"Dekiru 14","example":"「どちらがいいですか。」「うーん、こっちかな。」","exampleVi":"\"Cái nào tốt hơn?\" \"Ừm... chắc cái này.\"","note":"Từ đệm khi đang phân vân, giống ええと nhưng nghiêng về do dự hơn.","deck":"初級 14"},{"type":"vocab","word":"～について","reading":"～について","meaning":"về ~, liên quan đến ~","pos":"cấu trúc","lesson":"Dekiru 14","example":"日本の文化について話しました。","exampleVi":"Tôi đã nói về văn hoá Nhật.","note":"Gắn sau danh từ. Trang trọng hơn thì dùng 〜に関して.","deck":"初級 14"},{"type":"vocab","word":"私もそう思います","reading":"わたしもそうおもいます","meaning":"tôi cũng nghĩ vậy","pos":"cụm từ","lesson":"Dekiru 14","example":"「便利だと思います。」「私もそう思います。」","exampleVi":"\"Tôi thấy tiện.\" \"Tôi cũng nghĩ vậy.\"","note":"Câu đồng tình chuẩn trong họp hành. Phản đối nhẹ thì nói そうですねえ、でも…","deck":"初級 14"},{"type":"vocab","word":"ガラス","reading":"ガラス","meaning":"kính, thuỷ tinh","pos":"danh từ","lesson":"Dekiru 15","example":"ボールが当たって、窓のガラスが割れました。","exampleVi":"Bóng đập trúng làm kính cửa sổ vỡ.","note":"Gốc tiếng Hà Lan glas. Cốc thuỷ tinh là グラス — hai từ khác nhau một dấu.","deck":"初級 15"},{"type":"vocab","word":"曇り","reading":"くもり","meaning":"trời nhiều mây","pos":"danh từ","lesson":"Dekiru 15","example":"明日は曇りのち雨でしょう。","exampleVi":"Ngày mai trời nhiều mây rồi có mưa.","note":"ĐÀM. Bộ dự báo thời tiết: 晴れ (nắng) – 曇り (mây) – 雨 (mưa) – 雪 (tuyết).","deck":"初級 15"},{"type":"vocab","word":"台風","reading":"たいふう","meaning":"bão","pos":"danh từ","lesson":"Dekiru 15","example":"台風で電車が止まりました。","exampleVi":"Tàu điện dừng chạy vì bão.","note":"THAI PHONG. Nguyên nhân đi với で. Bão được đánh số: 台風18号.","deck":"初級 15"},{"type":"vocab","word":"地震","reading":"じしん","meaning":"động đất","pos":"danh từ","lesson":"Dekiru 15","example":"夜中に大きい地震がありました。","exampleVi":"Nửa đêm có trận động đất lớn.","note":"ĐỊA CHẤN = đất rung. Sang Nhật bạn sẽ gặp thật — nhớ kỹ từ này.","deck":"初級 15"},{"type":"vocab","word":"事故","reading":"じこ","meaning":"tai nạn, sự cố","pos":"danh từ","lesson":"Dekiru 15","example":"事故があって、道が込んでいます。","exampleVi":"Có tai nạn nên đường tắc.","note":"SỰ CỐ — trùng khít tiếng Việt. 交通事故 = tai nạn giao thông.","deck":"初級 15"},{"type":"vocab","word":"～大会","reading":"～たいかい","meaning":"đại hội, lễ hội","pos":"hậu tố","lesson":"Dekiru 15","example":"夏に花火大会があります。","exampleVi":"Mùa hè có lễ hội pháo hoa.","note":"ĐẠI HỘI. Gắn sau danh từ: 花火大会, スピーチ大会, マラソン大会.","deck":"初級 15"},{"type":"vocab","word":"チーム","reading":"チーム","meaning":"đội","pos":"danh từ","lesson":"Dekiru 15","example":"私たちのチームが勝ちました。","exampleVi":"Đội chúng tôi đã thắng.","note":"Ở công ty Nhật bạn sẽ nghe 開発チーム = nhóm phát triển.","deck":"初級 15"},{"type":"vocab","word":"中止","reading":"ちゅうし","meaning":"huỷ, dừng giữa chừng","pos":"danh từ","lesson":"Dekiru 15","example":"雨で試合が中止になりました。","exampleVi":"Trận đấu bị huỷ vì mưa.","note":"TRUNG CHỈ = dừng giữa chừng. Mẫu cố định: 〜は中止になりました.","deck":"初級 15"},{"type":"vocab","word":"フリーマーケット","reading":"フリーマーケット","meaning":"chợ trời","pos":"danh từ","lesson":"Dekiru 15","example":"日曜日に公園でフリーマーケットがあります。","exampleVi":"Chủ nhật có chợ trời ở công viên.","note":"Free market chứ không phải flea market trong cách hiểu của người Nhật. Nói tắt: フリマ.","deck":"初級 15"},{"type":"vocab","word":"本当","reading":"ほんとう","meaning":"sự thật","pos":"danh từ","lesson":"Dekiru 15","example":"それは本当ですか。","exampleVi":"Chuyện đó có thật không?","note":"BẢN ĐƯƠNG. 本当に = thật sự (trạng từ), 本当だ = đúng vậy.","deck":"初級 15"},{"type":"vocab","word":"昔","reading":"むかし","meaning":"ngày xưa","pos":"danh từ","lesson":"Dekiru 15","example":"昔、ここに大きい木がありました。","exampleVi":"Ngày xưa ở đây có một cái cây lớn.","note":"TÍCH. Truyện cổ tích Nhật đều mở đầu bằng 昔々（むかしむかし）.","deck":"初級 15"},{"type":"vocab","word":"無料","reading":"むりょう","meaning":"miễn phí","pos":"danh từ","lesson":"Dekiru 15","example":"この美術館は無料です。","exampleVi":"Bảo tàng này miễn phí.","note":"VÔ LIỆU = không mất phí. Trái nghĩa: 有料（ゆうりょう）.","deck":"初級 15"},{"type":"vocab","word":"夕方","reading":"ゆうがた","meaning":"chiều tối","pos":"danh từ","lesson":"Dekiru 15","example":"夕方から雨が降るそうです。","exampleVi":"Nghe nói từ chiều tối sẽ mưa.","note":"TỊCH PHƯƠNG. Bộ thời gian: 朝 – 昼 – 夕方 – 夜.","deck":"初級 15"},{"type":"vocab","word":"死にます［死ぬ］","reading":"しにます","meaning":"chết","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"その事故で三人が死にました。","exampleVi":"Ba người đã chết trong vụ tai nạn đó.","note":"TỬ. Động từ duy nhất trong tiếng Nhật kết thúc bằng ぬ. Nói về người quen thì dùng 亡くなる cho lịch sự. Động từ duy nhất kết thúc bằng ぬ","deck":"初級 15"},{"type":"vocab","word":"亡くなります［亡くなる］","reading":"なくなります","meaning":"qua đời","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"去年、祖父が亡くなりました。","exampleVi":"Năm ngoái ông tôi qua đời.","note":"VONG. Cách nói trang trọng thay cho 死ぬ khi nói về người. Cách nói lịch sự thay cho 死にます khi nói về người","deck":"初級 15"},{"type":"vocab","word":"止まります［止まる］","reading":"とまります","meaning":"(máy, xe) dừng lại","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"地震で電車が止まっています。","exampleVi":"Tàu đang dừng vì động đất.","note":"CHỈ. Tự động từ đi với が. Tha động từ là 止めます. Đừng nhầm với 泊まります (trọ lại).","deck":"初級 15"},{"type":"vocab","word":"始まります［始まる］","reading":"はじまります","meaning":"bắt đầu","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"会議は九時に始まります。","exampleVi":"Cuộc họp bắt đầu lúc 9 giờ.","note":"THUỶ. Tự động từ. Tha động từ là 始めます: 勉強を始めます.","deck":"初級 15"},{"type":"vocab","word":"降ります［降る］","reading":"ふります","meaning":"(mưa, tuyết) rơi","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"朝から雪が降っています。","exampleVi":"Từ sáng tuyết vẫn đang rơi.","note":"GIÁNG. Đừng nhầm với 降ります［降りる］おります = xuống xe — cùng kanji, khác cách đọc và khác nghĩa.","deck":"初級 15"},{"type":"vocab","word":"勝ちます［勝つ］","reading":"かちます","meaning":"thắng","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"日本のチームがベトナムに勝ちました。","exampleVi":"Đội Nhật đã thắng đội Việt Nam.","note":"THẮNG. Thắng ai dùng に, không dùng を. 〜に勝ちます","deck":"初級 15"},{"type":"vocab","word":"負けます［負ける］","reading":"まけます","meaning":"thua","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"三対一で負けました。","exampleVi":"Chúng tôi thua 3-1.","note":"PHỤ. Thua ai cũng dùng に. Tỉ số đọc là 〜対〜（たい）. 〜に負けます","deck":"初級 15"},{"type":"vocab","word":"倒れます［倒れる］","reading":"たおれます","meaning":"đổ, ngã","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"強い風で木が倒れました。","exampleVi":"Gió mạnh làm cây đổ.","note":"ĐẢO. Còn nghĩa 'ngã quỵ vì bệnh': 過労で倒れる = kiệt sức mà gục.","deck":"初級 15"},{"type":"vocab","word":"できます［できる］","reading":"できます","meaning":"hoàn thành, làm xong","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"駅の前に新しい店ができました。","exampleVi":"Trước ga có cửa hàng mới mở.","note":"Ngoài nghĩa 'có thể', できる còn nghĩa 'được hoàn thành, mọc lên'. Đây là nghĩa hay bị bỏ sót. 新しい店ができます = cửa hàng mới được xây xong","deck":"初級 15"},{"type":"vocab","word":"割れます［割れる］","reading":"われます","meaning":"vỡ (kính, ly)","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"地震でコップが割れました。","exampleVi":"Cốc vỡ vì động đất.","note":"Tự động từ, đi với が. Tha động từ là 割ります. Dùng cho vật giòn: kính, cốc, đĩa. Sách in nhầm phần trong ngoặc thành ［こわれる］; đúng phải là ［割れる］われる","deck":"初級 15"},{"type":"vocab","word":"結婚します［結婚する］","reading":"けっこんします","meaning":"kết hôn","pos":"động từ nhóm III","lesson":"Dekiru 15","example":"姉は去年結婚しました。","exampleVi":"Chị tôi cưới năm ngoái.","note":"KẾT HÔN — trùng khít. Cưới với ai dùng と, không dùng を. 〜と結婚します","deck":"初級 15"},{"type":"vocab","word":"入院します［入院する］","reading":"にゅういんします","meaning":"nhập viện","pos":"động từ nhóm III","lesson":"Dekiru 15","example":"父は一週間入院しました。","exampleVi":"Bố tôi nằm viện một tuần.","note":"NHẬP VIỆN — trùng khít. Xuất viện là 退院（たいいん）します. Sách in nhầm cách đọc thành にゅうんします, đúng là にゅういんします","deck":"初級 15"},{"type":"vocab","word":"怖い","reading":"こわい","meaning":"đáng sợ","pos":"tính từ -i","lesson":"Dekiru 15","example":"一人で夜道を歩くのは怖いです。","exampleVi":"Đi bộ đường đêm một mình thì sợ.","note":"BỐ. Chủ thể sợ dùng が: 犬が怖い = tôi sợ chó.","deck":"初級 15"},{"type":"vocab","word":"心配（な）","reading":"しんぱい（な）","meaning":"lo lắng","pos":"tính từ -na","lesson":"Dekiru 15","example":"試験の結果が心配です。","exampleVi":"Tôi lo về kết quả kỳ thi.","note":"TÂM PHỐI = lòng bồn chồn. Trái nghĩa: 安心（あんしん）. Đừng nhầm với 困る (gặp khó).","deck":"初級 15"},{"type":"vocab","word":"風","reading":"かぜ","meaning":"gió","pos":"danh từ","lesson":"Dekiru 15","example":"今日は風が強いですね。","exampleVi":"Hôm nay gió mạnh nhỉ.","note":"PHONG. Đồng âm với 風邪（かぜ, cảm cúm) — 風邪をひく = bị cảm.","deck":"初級 15"},{"type":"vocab","word":"ストラップ","reading":"ストラップ","meaning":"dây đeo (điện thoại, máy ảnh)","pos":"danh từ","lesson":"Dekiru 15","example":"かばんにストラップをつけました。","exampleVi":"Tôi gắn dây đeo vào cặp.","note":"Từ chế kiểu Nhật, chỉ dây đeo nhỏ trang trí cho điện thoại, cặp.","deck":"初級 15"},{"type":"vocab","word":"席","reading":"せき","meaning":"chỗ ngồi","pos":"danh từ","lesson":"Dekiru 15","example":"すみません、この席は空いていますか。","exampleVi":"Xin lỗi, chỗ này có ai ngồi chưa?","note":"TỊCH. 優先席 = ghế ưu tiên trên tàu — chữ bạn sẽ đọc mỗi ngày.","deck":"初級 15"},{"type":"vocab","word":"急ぎます［急ぐ］","reading":"いそぎます","meaning":"vội, gấp","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"急がないと、電車に間に合いません。","exampleVi":"Không nhanh lên là lỡ tàu đấy.","note":"CẤP. 急いで = nhanh lên (dạng て dùng như mệnh lệnh nhẹ).","deck":"初級 15"},{"type":"vocab","word":"混みます［混む］","reading":"こみます","meaning":"đông đúc","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"朝の電車はとても混んでいます。","exampleVi":"Tàu buổi sáng rất đông.","note":"HỖN. Luôn dùng dạng 混んでいます để tả trạng thái, không nói 混みます.","deck":"初級 15"},{"type":"vocab","word":"間に合います［間に合う］","reading":"まにあいます","meaning":"kịp giờ","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"走ったので、会議に間に合いました。","exampleVi":"Vì chạy nên tôi kịp giờ họp.","note":"GIAN HỢP = vừa khớp khoảng thời gian. Kịp cái gì dùng に. 〜に間に合います","deck":"初級 15"},{"type":"vocab","word":"やみます［やむ］","reading":"やみます","meaning":"(mưa) tạnh","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"雨がやんだら、出かけましょう。","exampleVi":"Mưa tạnh thì mình đi nhé.","note":"Chỉ dùng cho mưa, tuyết, gió, tiếng động — những thứ tự dừng.","deck":"初級 15"},{"type":"vocab","word":"晴れます［晴れる］","reading":"はれます","meaning":"trời nắng đẹp","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"明日は晴れるでしょう。","exampleVi":"Ngày mai chắc trời sẽ đẹp.","note":"TÌNH. Danh từ là 晴れ. Trái nghĩa: 曇る／雨が降る.","deck":"初級 15"},{"type":"vocab","word":"～パーセント","reading":"～パーセント","meaning":"~ phần trăm","pos":"hậu tố","lesson":"Dekiru 15","example":"この店は今、二十パーセント引きです。","exampleVi":"Cửa hàng này đang giảm 20%.","note":"Ký hiệu % đọc là パーセント. Người Nhật cũng hay nói 二割 (2 phần 10).","deck":"初級 15"},{"type":"vocab","word":"～引き","reading":"～びき","meaning":"giảm giá ~","pos":"hậu tố","lesson":"Dekiru 15","example":"三十パーセント引きで買いました。","exampleVi":"Tôi mua được với giá giảm 30%.","note":"引く = kéo, trừ đi. Biển giảm giá ở Nhật hay ghi 半額 (nửa giá) hoặc 〜割引. 10パーセント引き = giảm 10%","deck":"初級 15"},{"type":"vocab","word":"強い","reading":"つよい","meaning":"mạnh","pos":"tính từ -i","lesson":"Dekiru 15","example":"今日は風が強いです。","exampleVi":"Hôm nay gió mạnh.","note":"CƯỜNG. Trái nghĩa: 弱い（よわい）. Dùng cả cho người, gió, rượu, đội bóng.","deck":"初級 15"},{"type":"vocab","word":"きっと","reading":"きっと","meaning":"chắc chắn","pos":"phó từ","lesson":"Dekiru 15","example":"彼はきっと来ます。","exampleVi":"Anh ấy chắc chắn sẽ đến.","note":"Độ chắc chắn: きっと (cao) > たぶん (vừa) > もしかしたら (thấp).","deck":"初級 15"},{"type":"vocab","word":"たぶん","reading":"たぶん","meaning":"có lẽ","pos":"phó từ","lesson":"Dekiru 15","example":"たぶん明日は雨でしょう。","exampleVi":"Có lẽ mai trời mưa.","note":"Thường đi kèm でしょう hoặc と思います ở cuối câu.","deck":"初級 15"},{"type":"vocab","word":"もし","reading":"もし","meaning":"nếu","pos":"phó từ","lesson":"Dekiru 15","example":"もし雨が降ったら、行きません。","exampleVi":"Nếu trời mưa thì tôi không đi.","note":"Báo hiệu câu điều kiện, luôn đi cặp với 〜たら／〜ば ở vế sau. Đi với 〜たら","deck":"初級 15"},{"type":"vocab","word":"集まります［集まる］","reading":"あつまります","meaning":"tụ tập, tập trung","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"九時に駅の前に集まってください。","exampleVi":"9 giờ hãy tập trung trước ga.","note":"TẬP. Tự động từ, đi với が. Tha động từ là 集めます (thu thập, sưu tầm).","deck":"初級 15"},{"type":"vocab","word":"閉まります［閉まる］","reading":"しまります","meaning":"(cửa) đóng lại","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"ドアが閉まります。ご注意ください。","exampleVi":"Cửa sắp đóng, xin chú ý.","note":"BẾ. Câu bạn nghe mỗi ngày trên tàu Nhật. Tha động từ là 閉めます.","deck":"初級 15"},{"type":"vocab","word":"すきます［すく］","reading":"すきます","meaning":"vắng, rỗng","pos":"động từ nhóm I","lesson":"Dekiru 15","example":"昼の電車はすいています。","exampleVi":"Tàu buổi trưa vắng.","note":"Luôn dùng dạng すいています. Trái nghĩa: 混んでいます. Còn có おなかがすく = đói bụng. Trạng thái dùng すいています. Trái nghĩa: 混みます","deck":"初級 15"},{"type":"vocab","word":"落ちます［落ちる］","reading":"おちます","meaning":"rơi, rớt","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"かばんから財布が落ちました。","exampleVi":"Ví rơi ra khỏi cặp.","note":"LẠC. Tự động từ. Tha động từ là 落とします (đánh rơi). Còn nghĩa trượt kỳ thi: 試験に落ちる.","deck":"初級 15"},{"type":"vocab","word":"消えます［消える］","reading":"きえます","meaning":"(đèn) tắt; biến mất","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"風で火が消えました。","exampleVi":"Gió làm lửa tắt.","note":"TIÊU. Tự động từ đi với が. Tha động từ là 消します: 電気を消します.","deck":"初級 15"},{"type":"vocab","word":"壊れます［壊れる］","reading":"こわれます","meaning":"hỏng, vỡ","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"時計が壊れて、動きません。","exampleVi":"Đồng hồ hỏng, không chạy nữa.","note":"HOẠI. Dùng cho máy móc, đồ điện. Vật giòn vỡ thì dùng 割れる. Tự động từ. Tha động từ là 壊します","deck":"初級 15"},{"type":"vocab","word":"汚れます［汚れる］","reading":"よごれます","meaning":"bị bẩn","pos":"động từ nhóm II","lesson":"Dekiru 15","example":"雨で靴が汚れました。","exampleVi":"Giày bẩn vì mưa.","note":"Ô. Trạng thái bẩn dùng 汚れています. Tính từ 汚い là 'bẩn' nói chung.","deck":"初級 15"},{"type":"vocab","word":"方","reading":"かた","meaning":"người (cách gọi lịch sự)","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"あの方はどなたですか。","exampleVi":"Vị kia là ai vậy ạ?","note":"Lịch sự hơn 人. Đừng nhầm với 方（ほう）trong 〜のほうが.","deck":"初中級 1"},{"type":"vocab","word":"者","reading":"もの","meaning":"người (cách nói khiêm/trung tính)","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"私は日本語学校の者です。","exampleVi":"Tôi là người của trường tiếng Nhật.","note":"Dùng khi tự xưng với người ngoài; nói về người khác thì hơi thô.","deck":"初中級 1"},{"type":"vocab","word":"（お）刺身","reading":"さしみ","meaning":"món sashimi (cá sống)","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"お刺身が食べられますか。","exampleVi":"Anh ăn được sashimi không?","note":"","deck":"初中級 1"},{"type":"vocab","word":"チラシ","reading":"ちらし","meaning":"tờ rơi quảng cáo","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"駅でチラシをもらいました。","exampleVi":"Tôi nhận được tờ rơi ở ga.","note":"","deck":"初中級 1"},{"type":"vocab","word":"問い合わせ","reading":"といあわせ","meaning":"việc hỏi thông tin, liên hệ hỏi","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"アルバイトの問い合わせをしました。","exampleVi":"Tôi đã liên hệ hỏi về việc làm thêm.","note":"Động từ: 問い合わせる（nhóm II）.","deck":"初中級 1"},{"type":"vocab","word":"日常会話","reading":"にちじょうかいわ","meaning":"hội thoại thường ngày","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"日常会話は少しできます。","exampleVi":"Hội thoại thường ngày thì tôi nói được một chút.","note":"","deck":"初中級 1"},{"type":"vocab","word":"半年","reading":"はんとし","meaning":"nửa năm, sáu tháng","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"日本へ来て半年になります。","exampleVi":"Tôi sang Nhật được nửa năm rồi.","note":"Đọc はんとし, KHÔNG phải はんねん.","deck":"初中級 1"},{"type":"vocab","word":"ホームページ","reading":"ホームページ","meaning":"trang chủ, website","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"会社のホームページを見てください。","exampleVi":"Xin hãy xem trang web của công ty.","note":"","deck":"初中級 1"},{"type":"vocab","word":"面接","reading":"めんせつ","meaning":"phỏng vấn","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"明日、面接があります。","exampleVi":"Ngày mai tôi có buổi phỏng vấn.","note":"Động từ hoá: 面接を受ける (đi phỏng vấn).","deck":"初中級 1"},{"type":"vocab","word":"履歴書","reading":"りれきしょ","meaning":"sơ yếu lý lịch","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"履歴書を書いて持って行きます。","exampleVi":"Tôi sẽ viết sơ yếu lý lịch rồi mang đi.","note":"Mẫu chuẩn Nhật, mua ở konbini.","deck":"初中級 1"},{"type":"vocab","word":"思い出す","reading":"おもいだす","meaning":"nhớ ra, nhớ lại","pos":"động từ nhóm I","lesson":"Dekiru 初中級 1","example":"国の家族を思い出しました。","exampleVi":"Tôi nhớ đến gia đình ở quê.","note":"Khác 覚える (ghi nhớ vào đầu): 思い出す là lôi cái đã quên ra lại.","deck":"初中級 1"},{"type":"vocab","word":"希望する","reading":"きぼうする","meaning":"mong muốn, nguyện vọng","pos":"động từ nhóm III","lesson":"Dekiru 初中級 1","example":"週三日の勤務を希望します。","exampleVi":"Tôi mong được làm ba ngày một tuần.","note":"","deck":"初中級 1"},{"type":"vocab","word":"募集する","reading":"ぼしゅうする","meaning":"tuyển, chiêu mộ","pos":"động từ nhóm III","lesson":"Dekiru 初中級 1","example":"この店はアルバイトを募集しています。","exampleVi":"Quán này đang tuyển người làm thêm.","note":" :"たてもの","meaning":"toà nhà, công trình","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"あの白い建物が図書館です。","exampleVi":"Toà nhà trắng kia là thư viện.","note":"","deck":"初中級 1"},{"type":"vocab","word":"話","reading":"はなし","meaning":"câu chuyện, lời kể","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"先輩の話によると、この店は安いそうです。","exampleVi":"Nghe anh khoá trên nói thì quán này rẻ.","note":"Đọc はなし; động từ 話す là はなす.","deck":"初中級 1"},{"type":"vocab","word":"野外ライブ","reading":"やがいライブ","meaning":"buổi nhạc sống ngoài trời","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"週末、野外ライブに行きます。","exampleVi":"Cuối tuần tôi đi xem nhạc sống ngoài trời.","note":"","deck":"初中級 1"},{"type":"vocab","word":"歴史","reading":"れきし","meaning":"lịch sử","pos":"danh từ","lesson":"Dekiru 初中級 1","example":"日本の歴史に興味があります。","exampleVi":"Tôi quan tâm đến lịch sử Nhật Bản.","note":"","deck":"初中級 1"},{"type":"vocab","word":"〜個","reading":"〜こ","meaning":"~ cái (đơn vị đếm đồ nhỏ)","pos":"hậu tố đếm","lesson":"Dekiru 初中級 1","example":"りんごを三個買いました。","exampleVi":"Tôi mua ba quả táo.","note":"Biến âm: 一個 いっこ, 六個 ろっこ, 十個 じっこ.","deck":"初中級 1"},{"type":"vocab","word":"〜地","reading":"〜ち","meaning":"vùng, nơi ~","pos":"hậu tố","lesson":"Dekiru 初中級 1","example":"京都は有名な観光地です。","exampleVi":"Kyoto là địa điểm du lịch nổi tiếng.","note":"Ví dụ trong sách: 観光地（かんこうち）.","deck":"初中級 1"},{"type":"vocab","word":"聞き取る","reading":"ききとる","meaning":"nghe và hiểu được, nghe bắt được","pos":"động từ nhóm I","lesson":"Dekiru 初中級 1","example":"先生の話が聞き取れませんでした。","exampleVi":"Tôi đã không nghe ra được lời thầy.","note":"Thể khả năng 聞き取れる cực hay dùng khi học.","deck":"初中級 1"},{"type":"vocab","word":"応援する","reading":"おうえんする","meaning":"cổ vũ, ủng hộ","pos":"động từ nhóm III","lesson":"Dekiru 初中級 1","example":"友達のチームを応援しました。","exampleVi":"Tôi đã cổ vũ cho đội của bạn.","note":"","deck":"初中級 1"},{"type":"vocab","word":"サイクリングする","reading":"サイクリングする","meaning":"đạp xe dã ngoại","pos":"động từ nhóm III","lesson":"Dekiru 初中級 1","example":
